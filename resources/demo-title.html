<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trans-plant — Title Screen Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link href="shared.css" rel="stylesheet">
<script src="shared.js"></script>
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'VT323', monospace;
  background: #0e1118;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  min-height: 100vh;
  overflow-x: hidden;
  color: #d1d5db;
}

#demo-wrap { display: flex; gap: 20px; padding: 20px; align-items: flex-start; }

/* ── Actual-size toggle ─────────────────────────────────────────── */
#size-toggle {
  position: fixed; top: 12px; right: 12px; z-index: 9999;
  font-family: 'Press Start 2P', cursive;
  font-size: 8px; letter-spacing: 1px; text-transform: uppercase;
  padding: 8px 12px;
  background: linear-gradient(180deg, #3a4050 0%, #1a1f2a 100%);
  border: 2px outset;
  border-color: #5a6070 #1a1f2a #1a1f2a #5a6070;
  color: #c8a85a;
  cursor: var(--cursor-hand, pointer);
  border-radius: 2px;
}
#size-toggle:hover { filter: brightness(1.2); }
#size-toggle:active {
  border-style: inset;
  border-color: #1a1f2a #5a6070 #5a6070 #1a1f2a;
  transform: translate(1px, 1px);
}

body.fullsize { overflow: hidden; }
body.fullsize #demo-wrap { padding: 0; gap: 0; width: 100vw; height: 100vh; justify-content: center; align-items: center; }
body.fullsize #controls { display: none; }
body.fullsize #scale-root { transform-origin: center center; }

#scale-root { width: 960px; height: 640px; transform-origin: top left; flex-shrink: 0; }

:root {
  --prompt-y: 380px;
  --pulse-speed: 2s;
  --vignette: 0.55;
}

#game {
  width: 960px; height: 640px;
  position: relative; overflow: hidden;
  cursor: var(--cursor-hand, pointer);
}

/* ── Poster layer (shown before click) ──────────────────────────── */
/* Poster sits above title-content (z:10) while active so the image
   fully covers the taglines/buttons until the player clicks through. */
#poster {
  position: absolute; inset: 0;
  background-image: url('sprites/interface/poster-title.jpg');
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
  z-index: 20;
  transition: opacity 0.6s ease, transform 0.6s ease;
}
#poster-vignette {
  position: absolute; inset: 0; pointer-events: none; z-index: 21;
  background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,var(--vignette)) 100%);
  transition: opacity 0.6s ease;
}

#prompt-wrap {
  position: absolute;
  left: 0; right: 0; top: var(--prompt-y);
  text-align: center;
  z-index: 60;
  transition: opacity 0.4s ease, transform 0.4s ease;
}
#prompt {
  display: inline-block;
  font-family: 'Press Start 2P', cursive;
  font-size: 11px;
  letter-spacing: 3px;
  color: #e8d8a0;
  text-shadow:
    0 0 8px rgba(200,168,90,0.5),
    0 2px 4px rgba(0,0,0,0.9),
    1px 1px 0 #000;
  animation: prompt-pulse var(--pulse-speed) infinite ease-in-out;
}
@keyframes prompt-pulse {
  0%, 100% { opacity: 0.25; }
  50%      { opacity: 1;    }
}

/* Clicked-through state: poster fades out, revealing the title content. */
body.poster-dismissed #poster { opacity: 0; transform: scale(1.04); pointer-events: none; }
body.poster-dismissed #poster-vignette { opacity: 0; }
body.poster-dismissed #prompt-wrap { opacity: 0; transform: translateY(8px); pointer-events: none; }

#crt-overlay { pointer-events: none; position: absolute; inset: 0; z-index: 100; border-radius: 4px; }

/* ── Background layers ──────────────────────────────────────────── */
#bg-void { position: absolute; inset: 0; border-radius: 4px; }
#stars-far, #stars-near { position: absolute; inset: 0; pointer-events: none; }

/* ── Title content ──────────────────────────────────────────────── */
#title-content {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 10;
}

/* Taglines */
#title-tagline, #title-tagline-2, #title-tagline-3 {
  font-family: 'VT323', monospace;
  text-align: center;
  z-index: 1;
  max-width: 620px;
  line-height: 1.3;
  min-height: 1.3em;
}

/* tw-cursor + blink-cursor live in shared.css */

/* ── Buttons — warm retro style from reference ──────────────────── */
.title-buttons {
  display: flex; flex-direction: column;
  gap: 14px; align-items: center;
  z-index: 1; margin-top: 14px;
  opacity: 0; transition: opacity 0.6s ease;
}
.title-buttons.visible { opacity: 1; }

.retro-btn {
  font-family: 'VT323', monospace;
  font-size: 22px;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: var(--cursor-hand, pointer);
  padding: 10px 32px;
  transition: all 0.12s;
  position: relative;

  /* Reference-inspired: warm cream bg, orange border, rounded, double-layer */
  background: linear-gradient(180deg, #e8d8a0 0%, #d8c888 100%);
  color: #2a3040;
  border: 3px solid #c8a85a;
  border-radius: 8px;
  box-shadow: inset 0 0 0 2px rgba(200,168,90,0.3), 0 2px 4px rgba(0,0,0,0.4);
  text-shadow: none;
}

/* Brightness-based hover so it still works when apply() sets the
   background inline — inline styles would override a background
   rule but can't touch `filter`. */
.retro-btn:hover {
  filter: brightness(1.12);
  box-shadow: inset 0 0 0 2px rgba(200,168,90,0.4), 0 2px 10px rgba(200,168,90,0.25);
}

.retro-btn:active {
  transform: translate(1px, 1px);
  filter: brightness(0.95);
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
}

/* Accent button — teal variant */
.retro-btn.accent {
  background: linear-gradient(180deg, #8cc890 0%, #70b898 100%);
  border-color: #c8a85a;
  color: #1a2030;
  box-shadow: inset 0 0 0 2px rgba(140,200,144,0.3), 0 2px 4px rgba(0,0,0,0.4);
}

.retro-btn.accent:hover {
  box-shadow: inset 0 0 0 2px rgba(140,200,144,0.4), 0 2px 10px rgba(140,200,144,0.25);
}

/* Stripe decoration on accent button */
.retro-btn.accent::before {
  content: '';
  position: absolute;
  left: 8px; right: 8px; top: 4px; bottom: 4px;
  background: repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(255,255,255,0.08) 3px, rgba(255,255,255,0.08) 4px);
  border-radius: 4px;
  pointer-events: none;
}

.retro-btn.disabled { opacity: 0.3; cursor: var(--cursor-pointer, default); pointer-events: none; }

/* Small LED dot on button */
.retro-btn .btn-led {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  margin-right: 8px;
  vertical-align: middle;
  box-shadow: 0 0 4px currentColor;
}

/* ── Controls panel ─────────────────────────────────────────────── */
#controls {
  width: 400px; background: #161a22; border: 1px solid #2a3040;
  border-radius: 6px;
  padding: 16px; font-family: 'VT323', monospace; font-size: 16px; color: #8898a8;
  max-height: 640px; overflow-y: auto; overflow-x: hidden; flex-shrink: 0;
}
#controls h2 { font-family: 'Press Start 2P', cursive; font-size: 8px; color: #c8a85a; letter-spacing: 2px; margin-bottom: 14px; text-transform: uppercase; }
#controls h3 { font-family: 'Press Start 2P', cursive; font-size: 7px; color: #5a7a6a; letter-spacing: 1px; margin: 14px 0 8px; text-transform: uppercase; border-bottom: 1px solid #2a3040; padding-bottom: 4px; }
.ctrl-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
.ctrl-row label { font-size: 14px; color: #667; flex-shrink: 0; min-width: 90px; }
.ctrl-row input[type="range"] { flex: 1; accent-color: #c8a85a; height: 4px; }
.ctrl-row input[type="color"] { width: 32px; height: 24px; border: 1px solid #2a3040; border-radius: 3px; background: #0e1118; cursor: var(--cursor-hand, pointer); padding: 0; }
.ctrl-row .val { font-size: 13px; color: #5a7a6a; min-width: 60px; text-align: right; font-family: 'VT323', monospace; letter-spacing: 0.5px; }
.ctrl-row .val.modified { color: #e88830; font-weight: bold; }
.ctrl-row input[type="text"] { background: #1a2030; color: #c8a85a; border: 1px solid #2a3040; border-radius: 3px; font-family: 'VT323', monospace; font-size: 16px; padding: 2px 8px; flex: 1; }
#btn-reset { margin-top: 14px; width: 100%; font-size: 16px; padding: 6px; }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #0e1118; }
::-webkit-scrollbar-thumb { background: #2a3040; border-radius: 3px; }

</style>
</head>
<body>

<button id="size-toggle" onclick="toggleSize()">Actual Size</button>

<div id="demo-wrap">

<div id="scale-root">
<div id="game" tabindex="0">
  <div id="bg-void"></div>
  <canvas id="stars-far" width="960" height="640"></canvas>
  <canvas id="stars-near" width="960" height="640"></canvas>

  <div id="title-content">
    <div id="title-tagline"></div>
    <div id="title-tagline-2"></div>
    <div id="title-tagline-3"></div>
    <div class="title-buttons" id="title-buttons">
      <button class="retro-btn accent" id="btn-new"><span class="btn-led" style="background:#2a3040"></span>New Game</button>
      <button class="retro-btn disabled" id="btn-continue"><span class="btn-led" style="background:#333"></span>Continue</button>
    </div>
  </div>

  <!-- Poster sits above the star field but below the CRT overlay.
       Click anywhere (or press any key) to dismiss and reveal the title content. -->
  <div id="poster"></div>
  <div id="poster-vignette"></div>
  <div id="prompt-wrap"><span id="prompt">&gt; PRESS ANY KEY TO BEGIN &lt;</span></div>

  <div id="crt-overlay"></div>
</div>
</div>

<!-- ═══ CONTROLS ═══ -->
<div id="controls">
  <h2>Title Screen Controls</h2>

  <h3>Void</h3>
  <div class="ctrl-row"><label>Deep</label><input type="color" id="c-void-deep" value="#020408"></div>
  <div class="ctrl-row"><label>Mid</label><input type="color" id="c-void-mid" value="#0e1520"></div>

  <h3>Far Stars</h3>
  <div class="ctrl-row"><label>Count</label><input type="range" id="c-far-count" min="30" max="300" value="120"><span class="val" id="v-far-count">120</span></div>
  <div class="ctrl-row"><label>Drift X</label><input type="range" id="c-far-dx" min="-50" max="50" value="8"><span class="val" id="v-far-dx">8</span></div>
  <div class="ctrl-row"><label>Drift Y</label><input type="range" id="c-far-dy" min="-30" max="30" value="2"><span class="val" id="v-far-dy">2</span></div>
  <div class="ctrl-row"><label>Color</label><input type="color" id="c-far-color" value="#8899aa"></div>
  <div class="ctrl-row"><label>Twinkle</label><input type="range" id="c-far-twinkle" min="0" max="100" value="45"><span class="val" id="v-far-twinkle">45</span></div>

  <h3>Near Stars</h3>
  <div class="ctrl-row"><label>Count</label><input type="range" id="c-near-count" min="5" max="60" value="18"><span class="val" id="v-near-count">18</span></div>
  <div class="ctrl-row"><label>Drift X</label><input type="range" id="c-near-dx" min="-100" max="100" value="22"><span class="val" id="v-near-dx">22</span></div>
  <div class="ctrl-row"><label>Color</label><input type="color" id="c-near-color" value="#c8d0d8"></div>

  <h3>Poster</h3>
  <div class="ctrl-row"><label>Vignette</label><input type="range" id="c-poster-vig" min="0" max="100" value="30"><span class="val" id="v-poster-vig">0.30</span></div>
  <div class="ctrl-row"><label>Prompt Y</label><input type="range" id="c-prompt-y" min="40" max="600" value="380"><span class="val" id="v-prompt-y">380</span></div>
  <div class="ctrl-row"><label>Pulse (s)</label><input type="range" id="c-pulse" min="60" max="300" value="200"><span class="val" id="v-pulse">2.0</span></div>

  <h3>Taglines</h3>
  <div class="ctrl-row"><label>Line 1</label><input type="text" id="c-tag1" value="Earth is dying."></div>
  <div class="ctrl-row"><label>Line 2</label><input type="text" id="c-tag2" value="You have a ship, a crop, and a plan."></div>
  <div class="ctrl-row"><label>Line 3</label><input type="text" id="c-tag3" value="The plan is not good."></div>
  <div class="ctrl-row"><label>Size</label><input type="range" id="c-tag-size" min="16" max="28" value="25"><span class="val" id="v-tag-size">25</span></div>
  <div class="ctrl-row"><label>Color L1</label><input type="color" id="c-tag1-color" value="#7a8a7a"></div>
  <div class="ctrl-row"><label>Color L2</label><input type="color" id="c-tag2-color" value="#7a8a7a"></div>
  <div class="ctrl-row"><label>Color L3</label><input type="color" id="c-tag3-color" value="#4a5a4a"></div>
  <div class="ctrl-row"><label>Type speed</label><input type="range" id="c-type-speed" min="15" max="80" value="50"><span class="val" id="v-type-speed">50ms</span></div>
  <div class="ctrl-row"><label>Line pause</label><input type="range" id="c-line-pause" min="200" max="2000" value="800"><span class="val" id="v-line-pause">800ms</span></div>

  <h3>Frame</h3>
  <div class="ctrl-row"><label>Border</label><input type="color" id="c-frame-color" value="#c8a85a"></div>

  <h3>CRT</h3>
  <div class="ctrl-row"><label>Scanlines</label><input type="range" id="c-crt" min="0" max="25" value="10"><span class="val" id="v-crt">10%</span></div>

  <h3>Buttons</h3>
  <div class="ctrl-row"><label>Teal fill</label><input type="color" id="c-btn-teal" value="#8cc890"></div>
  <div class="ctrl-row"><label>Cream fill</label><input type="color" id="c-btn-cream" value="#e8d8a0"></div>
  <div class="ctrl-row"><label>Border</label><input type="color" id="c-btn-border" value="#c8a85a"></div>
  <div class="ctrl-row"><label>Radius</label><input type="range" id="c-btn-radius" min="0" max="30" value="25"><span class="val" id="v-btn-radius">25</span></div>
  <div class="ctrl-row"><label>Size</label><input type="range" id="c-btn-size" min="16" max="28" value="22"><span class="val" id="v-btn-size">22</span></div>

  <h3>Layout</h3>
  <div class="ctrl-row"><label>Gap</label><input type="range" id="c-gap" min="8" max="40" value="18"><span class="val" id="v-gap">18</span></div>

  <button class="retro-btn" id="btn-reset" onclick="resetAll()">Reset Defaults</button>
  <button class="retro-btn accent" style="margin-top:6px; width:100%; font-size:16px; padding:6px" onclick="replay()">Replay Intro</button>
</div>

</div>

<script>
(function() {
  'use strict';

  const $ = id => document.getElementById(id);

  // ── Scale ────────────────────────────────────────────────────
  function fitViewport() {
    let s;
    if (document.body.classList.contains('fullsize')) {
      s = Math.min(window.innerWidth / 960, window.innerHeight / 640);
    } else {
      const avail = Math.min(window.innerWidth - 460, window.innerWidth * 0.65);
      const h = window.innerHeight - 40;
      s = Math.min(avail / 960, h / 640, 1);
    }
    $('scale-root').style.transform = 'scale(' + s + ')';
  }
  fitViewport();
  window.addEventListener('resize', fitViewport);

  window.toggleSize = function() {
    document.body.classList.toggle('fullsize');
    const active = document.body.classList.contains('fullsize');
    $('size-toggle').textContent = active ? 'Demo Size' : 'Actual Size';
    fitViewport();
  };

  // ── Parallax layers ──────────────────────────────────────────
  const farCvs = $('stars-far'), farCtx = farCvs.getContext('2d');
  const nearCvs = $('stars-near'), nearCtx = nearCvs.getContext('2d');

  let farStars = [], nearStars = [];

  const cfg = {
    far: { count: 120, dx: 8, dy: 2, color: '#8899aa', twinkle: 45 },
    near: { count: 18, dx: 22, color: '#c8d0d8' }
  };

  function makeLayer(arr, count, type) {
    arr.length = 0;
    for (let i = 0; i < count; i++) {
      arr.push({
        x: Math.random() * 960, y: Math.random() * 640,
        r: type === 'far' ? Math.random() * 1.2 + 0.3 : Math.random() * 1.6 + 0.8,
        phase: Math.random() * Math.PI * 2,
        drift: Math.random() * 0.6 + 0.4
      });
    }
  }

  function initLayers() {
    makeLayer(farStars, cfg.far.count, 'far');
    makeLayer(nearStars, cfg.near.count, 'near');
  }

  function drawFrame() {
    if (PauseBus.paused) { requestAnimationFrame(drawFrame); return; }
    const now = performance.now() / 1000;

    // Far
    farCtx.clearRect(0, 0, 960, 640);
    const fTwk = cfg.far.twinkle / 100;
    for (const s of farStars) {
      s.x += (cfg.far.dx / 100) * s.drift;
      s.y += (cfg.far.dy / 100) * s.drift;
      if (s.x > 960) { s.x = 0; s.y = Math.random() * 640; }
      if (s.x < 0) { s.x = 960; s.y = Math.random() * 640; }
      if (s.y > 640) s.y = 0; if (s.y < 0) s.y = 640;
      farCtx.globalAlpha = 0.35 + (1 - fTwk) * 0.5 + Math.sin(now * 1.5 + s.phase) * fTwk * 0.35;
      farCtx.fillStyle = cfg.far.color;
      farCtx.beginPath();
      farCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      farCtx.fill();
    }
    farCtx.globalAlpha = 1;

    // Near
    nearCtx.clearRect(0, 0, 960, 640);
    for (const s of nearStars) {
      s.x += (cfg.near.dx / 100) * s.drift;
      if (s.x > 960) { s.x = -2; s.y = Math.random() * 640; }
      if (s.x < -2) { s.x = 960; s.y = Math.random() * 640; }
      nearCtx.globalAlpha = 0.6 + Math.sin(now * 0.8 + s.phase) * 0.2;
      nearCtx.fillStyle = cfg.near.color;
      nearCtx.beginPath();
      nearCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      nearCtx.fill();
    }
    nearCtx.globalAlpha = 1;
    requestAnimationFrame(drawFrame);
  }

  initLayers();
  drawFrame();

  // ── Typewriter ───────────────────────────────────────────────
  let twTimers = [];

  function typewrite(el, text, speed, color, onDone) {
    el.innerHTML = '';
    el.style.color = color;
    el.style.fontSize = $('c-tag-size').value + 'px';
    const span = document.createElement('span');
    const cursor = document.createElement('span');
    cursor.className = 'tw-cursor';
    cursor.style.background = color;
    el.appendChild(span);
    el.appendChild(cursor);
    let i = 0;
    function tick() {
      if (i < text.length) {
        span.textContent += text[i]; i++;
        twTimers.push(setTimeout(tick, speed));
      } else {
        cursor.style.visibility = 'hidden';
        if (onDone) onDone();
      }
    }
    tick();
  }

  // ── Intro sequence ───────────────────────────────────────────
  // Plays after the poster is dismissed: taglines type in, buttons
  // appear. No more sprout/TRANSPLANT logo — the poster image carries
  // the title art.
  function playIntro() {
    twTimers.forEach(t => clearTimeout(t));
    twTimers = [];
    $('title-buttons').classList.remove('visible');
    $('title-tagline').innerHTML = '';
    $('title-tagline-2').innerHTML = '';
    $('title-tagline-3').innerHTML = '';

    const speed = parseInt($('c-type-speed').value);
    const pause = parseInt($('c-line-pause').value);

    setTimeout(() => {
      typewrite($('title-tagline'), $('c-tag1').value, speed, $('c-tag1-color').value, () => {
        setTimeout(() => {
          typewrite($('title-tagline-2'), $('c-tag2').value, speed, $('c-tag2-color').value, () => {
            setTimeout(() => {
              typewrite($('title-tagline-3'), $('c-tag3').value, speed + 10, $('c-tag3-color').value, () => {
                setTimeout(() => $('title-buttons').classList.add('visible'), 400);
              });
            }, pause);
          });
        }, pause);
      });
    }, 400);
  }

  // ── Poster dismiss ───────────────────────────────────────────
  let posterDismissed = false;
  function dismissPoster() {
    if (posterDismissed) return;
    posterDismissed = true;
    document.body.classList.add('poster-dismissed');
    setTimeout(playIntro, 600);
  }
  function restorePoster() {
    posterDismissed = false;
    document.body.classList.remove('poster-dismissed');
    twTimers.forEach(t => clearTimeout(t));
    twTimers = [];
    $('title-buttons').classList.remove('visible');
    $('title-tagline').innerHTML = '';
    $('title-tagline-2').innerHTML = '';
    $('title-tagline-3').innerHTML = '';
  }
  function onSceneInput(e) {
    if (e && e.target && e.target.closest && e.target.closest('#controls, #size-toggle, .retro-btn')) return;
    if (!posterDismissed) dismissPoster();
  }
  window.addEventListener('keydown', onSceneInput);
  document.getElementById('game').addEventListener('click', onSceneInput);

  // ── Apply styles ─────────────────────────────────────────────
  function apply() {
    // Void
    $('bg-void').style.background = 'linear-gradient(180deg, ' + $('c-void-deep').value + ' 0%, ' + $('c-void-mid').value + ' 100%)';

    // Stars cfg
    const fCount = parseInt($('c-far-count').value);
    cfg.far.dx = parseInt($('c-far-dx').value); cfg.far.dy = parseInt($('c-far-dy').value);
    cfg.far.color = $('c-far-color').value; cfg.far.twinkle = parseInt($('c-far-twinkle').value);
    if (fCount !== cfg.far.count) { cfg.far.count = fCount; makeLayer(farStars, fCount, 'far'); }
    $('v-far-count').textContent = fCount; $('v-far-dx').textContent = cfg.far.dx;
    $('v-far-dy').textContent = cfg.far.dy; $('v-far-twinkle').textContent = cfg.far.twinkle;

    const nCount = parseInt($('c-near-count').value);
    cfg.near.dx = parseInt($('c-near-dx').value); cfg.near.color = $('c-near-color').value;
    if (nCount !== cfg.near.count) { cfg.near.count = nCount; makeLayer(nearStars, nCount, 'near'); }
    $('v-near-count').textContent = nCount; $('v-near-dx').textContent = cfg.near.dx;

    // Poster
    const pVig  = $('c-poster-vig').value / 100;
    const pY    = $('c-prompt-y').value;
    const pulse = $('c-pulse').value / 100;
    document.documentElement.style.setProperty('--vignette', pVig.toFixed(2));
    document.documentElement.style.setProperty('--prompt-y', pY + 'px');
    document.documentElement.style.setProperty('--pulse-speed', pulse.toFixed(2) + 's');
    $('v-poster-vig').textContent = pVig.toFixed(2);
    $('v-prompt-y').textContent = pY;
    $('v-pulse').textContent = pulse.toFixed(2);

    // Tags
    const tagSize = $('c-tag-size').value + 'px';
    const tagColors = [$('c-tag1-color').value, $('c-tag2-color').value, $('c-tag3-color').value];
    ['title-tagline', 'title-tagline-2', 'title-tagline-3'].forEach((id, i) => {
      const div = $(id);
      div.style.fontSize = tagSize;
      div.style.setProperty('color', tagColors[i], 'important');
      div.querySelectorAll('span').forEach(s => {
        if (s.classList.contains('tw-cursor')) {
          s.style.background = tagColors[i];
        } else {
          s.style.setProperty('color', tagColors[i], 'important');
        }
      });
    });
    $('v-tag-size').textContent = $('c-tag-size').value;
    $('v-type-speed').textContent = $('c-type-speed').value + 'ms';
    $('v-line-pause').textContent = $('c-line-pause').value + 'ms';

    // Frame
    const frameC = $('c-frame-color').value;
    $('game').style.borderColor = frameC;

    // CRT
    const crt = $('c-crt').value;
    $('crt-overlay').style.background = 'repeating-linear-gradient(0deg, rgba(0,0,0,' + (crt / 100) + '), rgba(0,0,0,' + (crt / 100) + ') 1px, transparent 1px, transparent 2px)';
    $('v-crt').textContent = crt + '%';

    // Buttons
    const btnTeal = $('c-btn-teal').value;
    const btnCream = $('c-btn-cream').value;
    const btnBorder = $('c-btn-border').value;
    const btnRadius = $('c-btn-radius').value;
    const btnSize = $('c-btn-size').value;

    document.querySelectorAll('.retro-btn.accent').forEach(b => {
      b.style.background = 'linear-gradient(180deg, ' + btnTeal + ' 0%, ' + adjustBrightness(btnTeal, -20) + ' 100%)';
      b.style.borderColor = btnBorder;
      b.style.borderRadius = btnRadius + 'px';
      b.style.fontSize = btnSize + 'px';
    });
    document.querySelectorAll('.retro-btn:not(.accent)').forEach(b => {
      b.style.background = 'linear-gradient(180deg, ' + btnCream + ' 0%, ' + adjustBrightness(btnCream, -15) + ' 100%)';
      b.style.borderColor = btnBorder;
      b.style.borderRadius = btnRadius + 'px';
      b.style.fontSize = btnSize + 'px';
    });
    $('v-btn-radius').textContent = btnRadius; $('v-btn-size').textContent = btnSize;

    // Layout
    const gap = $('c-gap').value;
    $('title-content').style.gap = gap + 'px';
    $('v-gap').textContent = gap;
  }

  function adjustBrightness(hex, amt) {
    let r = parseInt(hex.slice(1, 3), 16) + amt;
    let g = parseInt(hex.slice(3, 5), 16) + amt;
    let b = parseInt(hex.slice(5, 7), 16) + amt;
    r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
    return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
  }

  // ── Defaults ─────────────────────────────────────────────────
  const DEFAULTS = {
    'c-void-deep': '#020408', 'c-void-mid': '#0e1520',
    'c-far-count': '120', 'c-far-dx': '8', 'c-far-dy': '2', 'c-far-color': '#8899aa', 'c-far-twinkle': '45',
    'c-near-count': '18', 'c-near-dx': '22', 'c-near-color': '#c8d0d8',
    'c-poster-vig': '30', 'c-prompt-y': '380', 'c-pulse': '200',
    'c-tag1': 'Earth is dying.',
    'c-tag2': 'You have a ship, a crop, and a plan.',
    'c-tag3': 'The plan is not good.',
    'c-tag-size': '25', 'c-tag1-color': '#7a8a7a', 'c-tag2-color': '#7a8a7a', 'c-tag3-color': '#4a5a4a', 'c-type-speed': '50', 'c-line-pause': '800',
    'c-frame-color': '#c8a85a',
    'c-crt': '10',
    'c-btn-teal': '#8cc890', 'c-btn-cream': '#e8d8a0', 'c-btn-border': '#c8a85a', 'c-btn-radius': '25', 'c-btn-size': '22',
    'c-gap': '18'
  };

  // ── Auto-add hex readouts to color inputs ────────────────────
  document.querySelectorAll('#controls input[type="color"]').forEach(input => {
    if (input.parentElement.querySelector('.val')) return;
    const span = document.createElement('span');
    span.className = 'val';
    span.textContent = input.value.toUpperCase();
    input.parentElement.appendChild(span);
    input.addEventListener('input', () => { span.textContent = input.value.toUpperCase(); });
  });

  function markModified() {
    for (const [id, defVal] of Object.entries(DEFAULTS)) {
      const el = $(id);
      if (!el) continue;
      const span = el.parentElement.querySelector('.val');
      if (!span) continue;
      const isModified = String(el.value).toLowerCase() !== String(defVal).toLowerCase();
      span.classList.toggle('modified', isModified);
    }
  }

  // ── Bind ─────────────────────────────────────────────────────
  document.querySelectorAll('#controls input').forEach(el => el.addEventListener('input', () => {
    apply();
    markModified();
  }));

  // ── Reset ────────────────────────────────────────────────────
  window.resetAll = function() {
    for (const [id, val] of Object.entries(DEFAULTS)) {
      const el = $(id);
      if (!el) continue;
      el.value = val;
      if (el.type === 'color') {
        const span = el.parentElement.querySelector('.val');
        if (span) span.textContent = val.toUpperCase();
      }
    }
    apply();
    initLayers();
    markModified();
  };

  window.replay = function() { apply(); restorePoster(); };

  apply();
  markModified();
  // Start on poster; intro plays after dismiss.

})();
</script>
</body>
</html>
