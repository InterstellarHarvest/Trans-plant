<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trans-Plant — Cursor Armory</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e14;
    --panel: #151b26;
    --panel-hi: #1e2636;
    --border: #2a3a48;
    --gold: #c8a85a;
    --teal: #35c6bf;
    --red: #cc3333;
    --green: #55cc55;
    --cream: #d0c890;
    --text: #8a9ab5;
    --text-dim: #4a5a6a;
    --white: #e8e0d0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'VT323', monospace;
    font-size: 16px;
    overflow-x: hidden;
    min-height: 100vh;
  }

  .header {
    background: linear-gradient(180deg, #1a2030 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex; align-items: baseline; gap: 16px;
  }
  .header h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px; color: var(--gold); letter-spacing: 2px;
  }
  .header .subtitle { font-size: 14px; color: var(--text-dim); letter-spacing: 1px; }

  .app {
    display: grid;
    grid-template-columns: 260px 1fr;
    grid-template-rows: auto 1fr;
    gap: 0; height: calc(100vh - 53px);
  }

  /* ── Gallery ──────────────────────────── */
  .gallery {
    grid-row: 1 / -1;
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto; padding: 12px;
  }
  .gallery-section {
    font-size: 13px; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: 2px; padding: 12px 8px 8px;
  }
  .gallery-section:first-child { padding-top: 4px; }
  .gallery-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .gallery-item {
    aspect-ratio: 1;
    background: var(--bg); border: 2px solid var(--border); border-radius: 4px;
    cursor: pointer; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px;
    transition: border-color 0.15s, background 0.15s;
  }
  .gallery-item:hover { border-color: var(--text-dim); background: #0e1420; }
  .gallery-item.selected {
    border-color: var(--teal); background: #0e1a20;
    box-shadow: 0 0 12px rgba(53,198,191,0.15);
  }
  .gallery-item canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  .gallery-item .label {
    font-size: 12px; color: var(--cream); text-transform: uppercase; letter-spacing: 1px;
  }
  .gallery-item .type-badge {
    font-size: 10px; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: 1px; position: absolute; top: 4px; right: 6px;
  }
  .gallery-item { position: relative; }

  /* ── Controls ─────────────────────────── */
  .controls {
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end;
  }
  .ctrl-group { display: flex; flex-direction: column; gap: 4px; }
  .ctrl-group label {
    font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.5px;
  }
  .ctrl-group input[type="range"] { width: 110px; accent-color: var(--teal); height: 18px; }
  .ctrl-group input[type="color"] {
    width: 36px; height: 28px; border: 2px solid var(--border);
    border-radius: 3px; background: var(--bg); cursor: pointer; padding: 1px;
  }
  .ctrl-group select {
    font-family: 'VT323', monospace; font-size: 15px; background: var(--bg);
    color: var(--cream); border: 2px solid var(--border); border-radius: 3px;
    padding: 3px 8px; cursor: pointer;
  }
  .ctrl-group .val { font-size: 14px; color: var(--gold); min-width: 28px; text-align: right; }
  .ctrl-row { display: flex; align-items: center; gap: 6px; }
  .ctrl-group input[type="checkbox"] { accent-color: var(--teal); width: 16px; height: 16px; cursor: pointer; }
  .chk-label { font-size: 14px; color: var(--cream); cursor: pointer; }

  /* ── Test Range ───────────────────────── */
  .test-range { position: relative; overflow: hidden; background: #060a10; }
  .test-range canvas#stars-bg {
    position: absolute; inset: 0; width: 100%; height: 100%;
  }
  .test-range .range-label {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    font-size: 13px; color: var(--text-dim); letter-spacing: 2px;
    text-transform: uppercase; pointer-events: none; z-index: 5;
  }
  .test-range .coords {
    position: absolute; top: 12px; right: 16px; font-size: 14px;
    color: var(--text-dim); pointer-events: none; z-index: 5;
  }
  .test-range .reticle-name {
    position: absolute; top: 12px; left: 16px; font-size: 14px;
    color: var(--gold); pointer-events: none; z-index: 5;
    letter-spacing: 1px; text-transform: uppercase;
  }

  /* Interactive zones in test range */
  .test-zone {
    position: absolute; z-index: 4; border: 1px dashed rgba(138,154,181,0.2);
    border-radius: 4px; display: flex; align-items: center; justify-content: center;
  }
  .test-zone .zone-label {
    font-size: 11px; color: var(--text-dim); letter-spacing: 1.5px;
    text-transform: uppercase; pointer-events: none; text-align: center;
    line-height: 1.4;
  }

  /* Preview */
  .preview-box {
    position: absolute; bottom: 40px; right: 16px;
    background: rgba(21,27,38,0.85); border: 1px solid var(--border);
    border-radius: 4px; padding: 10px; display: flex; flex-direction: column;
    align-items: center; gap: 6px; z-index: 10; pointer-events: none;
  }
  .preview-box canvas { image-rendering: pixelated; image-rendering: crisp-edges; border: 1px solid var(--border); }
  .preview-box .preview-label { font-size: 11px; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; }
  .preview-box .hotspot-info { font-size: 12px; color: var(--gold); letter-spacing: 1px; }

  /* Export */
  .export-bar { position: absolute; bottom: 12px; right: 16px; z-index: 10; display: flex; gap: 8px; }
  .export-btn {
    font-family: 'VT323', monospace; font-size: 14px; text-transform: uppercase;
    letter-spacing: 1px; padding: 5px 14px; border: 2px solid var(--border); border-radius: 3px;
    background: linear-gradient(180deg, #39404F 0%, #252A38 50%, #4B597A 100%);
    color: var(--cream); cursor: pointer;
    border-top-color: #5a6070; border-left-color: #5a6070;
    border-bottom-color: #1a1f2a; border-right-color: #1a1f2a;
  }
  .export-btn:hover { color: var(--gold); }
  .export-btn:active {
    border-top-color: #1a1f2a; border-left-color: #1a1f2a;
    border-bottom-color: #5a6070; border-right-color: #5a6070;
  }

  ::-webkit-scrollbar       { width: 6px; }
  ::-webkit-scrollbar-track { background: #0a0e14; }
  ::-webkit-scrollbar-thumb { background: #2a3a48; border-radius: 3px; }
</style>
</head>

// ═══════════════════════════════════════════════════════════
//  PIXEL-CIRCLE HELPER
// ═══════════════════════════════════════════════════════════
function pixelCircle(ctx, cx, cy, radius, thickness) {
  if (radius < 1) { ctx.fillRect(cx, cy, 1, 1); return; }
  for (let w = 0; w < thickness; w++) {
    const r = radius - w;
    if (r < 0) break;
    let x = r, y = 0, err = 1 - r;
    while (x >= y) {
      const pts = [
        [cx+x,cy+y],[cx-x,cy+y],[cx+x,cy-y],[cx-x,cy-y],
        [cx+y,cy+x],[cx-y,cy+x],[cx+y,cy-x],[cx-y,cy-x],
      ];
      for (const [px,py] of pts) ctx.fillRect(px, py, 1, 1);
      y++;
      if (err < 0) err += 2*y+1;
      else { x--; err += 2*(y-x)+1; }
    }
  }
}

// ═══════════════════════════════════════════════════════════
//  RETICLE DEFINITIONS (parametric draw functions)
// ═══════════════════════════════════════════════════════════

const RETICLES = [
  {
    id: 'classic', name: 'Classic', type: 'reticle',
    desc: 'Standard crosshair. Field-tested on 40,000 asteroids.',
    draw(ctx, s, t, g, o) {
      ctx.fillStyle = o.color1;
      ctx.fillRect(-s, -Math.floor(t/2), s-g, t);
      ctx.fillRect(g+1, -Math.floor(t/2), s-g, t);
      ctx.fillRect(-Math.floor(t/2), -s, t, s-g);
      ctx.fillRect(-Math.floor(t/2), g+1, t, s-g);
    }
  },
  {
    id: 'dot', name: 'Dot', type: 'reticle',
    desc: 'Minimal. The ship computer approves of its efficiency.',
    draw(ctx, s, t, g, o) {
      const r = Math.max(1, t);
      ctx.fillStyle = o.color1;
      ctx.fillRect(-r, -r, r*2+1, r*2+1);
    }
  },
  {
    id: 'circle', name: 'Circle', type: 'reticle',
    desc: 'Ring sight. Probability of hitting what you aim at: non-zero.',
    draw(ctx, s, t, g, o) {
      ctx.fillStyle = o.color1;
      pixelCircle(ctx, 0, 0, s-1, t);
    }
  },
  {
    id: 'brackets', name: 'Brackets', type: 'reticle',
    desc: 'Corner brackets. Frames the target like a botanical specimen.',
    draw(ctx, s, t, g, o) {
      const arm = Math.max(3, Math.floor(s*0.45));
      ctx.fillStyle = o.color1;
      ctx.fillRect(-s,-s,arm,t); ctx.fillRect(-s,-s,t,arm);
      ctx.fillRect(s-arm+1,-s,arm,t); ctx.fillRect(s-t+1,-s,t,arm);
      ctx.fillRect(-s,s-t+1,arm,t); ctx.fillRect(-s,s-arm+1,t,arm);
      ctx.fillRect(s-arm+1,s-t+1,arm,t); ctx.fillRect(s-t+1,s-arm+1,t,arm);
    }
  },
  {
    id: 'diamond', name: 'Diamond', type: 'reticle',
    desc: 'Rotated square. For when your targeting solution has style.',
    draw(ctx, s, t, g, o) {
      ctx.fillStyle = o.color1;
      const r = s-1;
      for (let i=0;i<=r;i++) {
        const py=-r+i;
        ctx.fillRect(i,py,t,1); ctx.fillRect(-i-t+1,py,t,1);
        ctx.fillRect(r-i,i,t,1); ctx.fillRect(-r+i-t+1,i,t,1);
      }
    }
  },
  {
    id: 'chevron', name: 'Chevron', type: 'reticle',
    desc: 'V-sight. Points at the thing you want to stop existing.',
    draw(ctx, s, t, g, o) {
      ctx.fillStyle = o.color1;
      const h = Math.floor(s*0.7);
      for (let i=0;i<h;i++) {
        ctx.fillRect(i,-h+i+g,t,t);
        ctx.fillRect(-i-t+1,-h+i+g,t,t);
      }
    }
  },
  {
    id: 'scanner', name: 'Scanner', type: 'reticle',
    desc: 'Sweep reticle. The botanist uses this to identify weeds.',
    draw(ctx, s, t, g, o) {
      ctx.fillStyle = o.color1;
      ctx.fillRect(-s,-1,s*2+1,t);
      ctx.fillRect(-Math.floor(t/2),-s,t,s-g);
      ctx.fillRect(-Math.floor(t/2),g+1,t,s-g);
      const tick = Math.max(2, Math.floor(s*0.3));
      ctx.fillStyle = o.color2;
      ctx.fillRect(-s,-tick-2,t,tick); ctx.fillRect(s-t+1,-tick-2,t,tick);
      ctx.fillRect(-s,2+t,t,tick); ctx.fillRect(s-t+1,2+t,t,tick);
    }
  },
  {
    id: 'bullseye', name: 'Bullseye', type: 'reticle',
    desc: 'Concentric rings. Onion-like. The crew finds this unsettling.',
    draw(ctx, s, t, g, o) {
      ctx.fillStyle = o.color1;
      pixelCircle(ctx, 0, 0, s-1, t);
      if (s > 6) {
        ctx.fillStyle = o.color2;
        pixelCircle(ctx, 0, 0, Math.floor((s-1)*0.55), Math.max(1,t-1));
      }
    }
  },
  {
    id: 'crossdot', name: 'Cross-Dot', type: 'reticle',
    desc: 'Short cross + center dot. Quick acquisition. Plants approve.',
    draw(ctx, s, t, g, o) {
      const arm = Math.floor(s*0.5);
      ctx.fillStyle = o.color1;
      ctx.fillRect(-s,-Math.floor(t/2),arm,t);
      ctx.fillRect(s-arm+1,-Math.floor(t/2),arm,t);
      ctx.fillRect(-Math.floor(t/2),-s,t,arm);
      ctx.fillRect(-Math.floor(t/2),s-arm+1,t,arm);
      const d = Math.max(1,t);
      ctx.fillStyle = o.color2;
      ctx.fillRect(-d,-d,d*2+1,d*2+1);
    }
  },
  {
    id: 'tripod', name: 'Tripod', type: 'reticle',
    desc: 'Three-point. Triangulates target. Not legally distinct from anything.',
    draw(ctx, s, t, g, o) {
      ctx.fillStyle = o.color1;
      const r = s-1;
      const angles = [-Math.PI/2, Math.PI/6, 5*Math.PI/6];
      for (const a of angles) {
        const dx=Math.cos(a), dy=Math.sin(a);
        for (let i=g;i<=r;i++) ctx.fillRect(Math.round(dx*i),Math.round(dy*i),t,t);
      }
    }
  },
  {
    id: 'hud', name: 'HUD', type: 'reticle',
    desc: 'Military-grade display. The ship thinks this is overkill for gardening.',
    draw(ctx, s, t, g, o) {
      const arm = Math.max(3, Math.floor(s*0.35));
      ctx.fillStyle = o.color1;
      ctx.fillRect(-s,-s,arm,t); ctx.fillRect(-s,-s,t,arm);
      ctx.fillRect(s-arm+1,-s,arm,t); ctx.fillRect(s-t+1,-s,t,arm);
      ctx.fillRect(-s,s-t+1,arm,t); ctx.fillRect(-s,s-arm+1,t,arm);
      ctx.fillRect(s-arm+1,s-t+1,arm,t); ctx.fillRect(s-t+1,s-arm+1,t,arm);
      ctx.fillStyle = o.color2;
      ctx.fillRect(-g-2,0,g-1,1); ctx.fillRect(3,0,g-1,1);
      ctx.fillRect(0,-g-2,1,g-1); ctx.fillRect(0,3,1,g-1);
    }
  },
  {
    id: 'leaf', name: 'Leaf', type: 'reticle',
    desc: 'Botanical targeting. Because every shot should nurture something.',
    draw(ctx, s, t, g, o) {
      ctx.fillStyle = o.color1;
      const h=s-1;
      for (let y=-h;y<=h;y++) {
        const w = Math.round((1-(y*y)/(h*h))*h*0.6);
        if (w>0) { ctx.fillRect(-w,y,t,1); ctx.fillRect(w-t+1,y,t,1); }
      }
      ctx.fillStyle = o.color2;
      ctx.fillRect(0,-h,1,h*2+1);
    }
  },
  {
    id: 'orbital', name: 'Orbital', type: 'reticle',
    desc: 'Ring + cross. Standard-issue for Kepler-9 security detail.',
    draw(ctx, s, t, g, o) {
      ctx.fillStyle = o.color1;
      pixelCircle(ctx, 0, 0, s-1, Math.max(1,t-1));
      const ext = Math.floor(s*0.35);
      ctx.fillRect(-s-ext,-Math.floor(t/2),ext,t);
      ctx.fillRect(s,-Math.floor(t/2),ext,t);
      ctx.fillRect(-Math.floor(t/2),-s-ext,t,ext);
      ctx.fillRect(-Math.floor(t/2),s,t,ext);
    }
  },
  {
    id: 'dashes', name: 'Dashes', type: 'reticle',
    desc: 'Segmented cross. Intermittent, like the crew\'s will to live.',
    draw(ctx, s, t, g, o) {
      ctx.fillStyle = o.color1;
      const seg=Math.max(2,Math.floor(s*0.3));
      const dg=Math.max(1,Math.floor(t*0.8));
      for (let i=g+1;i<s;i+=seg+dg) {
        const len=Math.min(seg,s-i);
        ctx.fillRect(i,-Math.floor(t/2),len,t);
        ctx.fillRect(-i-len+1,-Math.floor(t/2),len,t);
        ctx.fillRect(-Math.floor(t/2),i,t,len);
        ctx.fillRect(-Math.floor(t/2),-i-len+1,t,len);
      }
    }
  },
  {
    id: 'xhair', name: 'X-Hair', type: 'reticle',
    desc: 'Diagonal cross. For problems that require a lateral approach.',
    draw(ctx, s, t, g, o) {
      ctx.fillStyle = o.color1;
      const r=s-1;
      for (let i=g;i<=r;i++) {
        ctx.fillRect(i,i,t,t); ctx.fillRect(-i-t+1,i,t,t);
        ctx.fillRect(i,-i-t+1,t,t); ctx.fillRect(-i-t+1,-i-t+1,t,t);
      }
    }
  },
  {
    id: 'scope', name: 'Scope', type: 'reticle',
    desc: 'Full scope overlay. Pretend you\'re a professional.',
    draw(ctx, s, t, g, o) {
      ctx.fillStyle = o.color1;
      pixelCircle(ctx, 0, 0, s-1, t);
      ctx.fillRect(-s,-Math.floor(t/2),s-g,t);
      ctx.fillRect(g+1,-Math.floor(t/2),s-g,t);
      ctx.fillRect(-Math.floor(t/2),-s,t,s-g);
      ctx.fillRect(-Math.floor(t/2),g+1,t,s-g);
    }
  },
];


// ═══════════════════════════════════════════════════════════
//  UNIFIED CATALOG
// ═══════════════════════════════════════════════════════════
const ALL_CURSORS = [...SPRITE_CURSORS, ...RETICLES];


// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════
let state = {
  selected: 0,
  size: 32, thickness: 2, gap: 3,
  color1: '#cccc99', color2: '#c8a85a',
  outline: true, dot: false,
  anim: 'none', opacity: 100, scale: 2,
  frame: 0,
};


// ═══════════════════════════════════════════════════════════
//  SPRITE DRAW — renders a pixel-map cursor to canvas
// ═══════════════════════════════════════════════════════════
function drawSpriteCursor(canvas, sprite, opts) {
  const px = sprite.pixels;
  const h = px.length;
  const w = Math.max(...px.map(r => r.length));
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, w, h);
  ctx.globalAlpha = (opts.opacity ?? 100) / 100;
  const colors = { 1: opts.color1, 2: '#000000' };
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < px[y].length; x++) {
      const v = px[y][x];
      if (v === 0) continue;
      ctx.fillStyle = colors[v] || '#000';
      ctx.fillRect(x, y, 1, 1);
    }
  }
  return canvas;
}


// ═══════════════════════════════════════════════════════════
//  RETICLE DRAW — renders a parametric reticle to canvas
// ═══════════════════════════════════════════════════════════
function drawReticle(canvas, entry, size, opts) {
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, size, size);

  const cx = Math.floor(size/2), cy = Math.floor(size/2);
  const half = Math.floor(size/2) - 1;

  ctx.save();
  ctx.globalAlpha = (opts.opacity ?? 100) / 100;

  const frame = opts.frame || 0;
  if (opts.anim === 'spin') {
    ctx.translate(cx, cy);
    ctx.rotate((frame % 360) * Math.PI / 180);
    ctx.translate(-cx, -cy);
  }
  let sc = 1;
  if (opts.anim === 'pulse') sc = 1 + 0.08 * Math.sin(frame * 0.1);
  if (opts.anim === 'breathe') sc = 0.85 + 0.15 * (0.5 + 0.5 * Math.sin(frame * 0.05));

  if (opts.outline) {
    const blk = { color1: '#000000', color2: '#000000' };
    for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      ctx.save(); ctx.translate(cx+dx, cy+dy);
      if (sc !== 1) ctx.scale(sc,sc);
      entry.draw(ctx, half, opts.thickness??2, opts.gap??3, blk);
      ctx.restore();
    }
  }
  ctx.save(); ctx.translate(cx, cy);
  if (sc !== 1) ctx.scale(sc,sc);
  entry.draw(ctx, half, opts.thickness??2, opts.gap??3, opts);
  ctx.restore();

  if (opts.dot) {
    ctx.fillStyle = opts.color2 || opts.color1;
    ctx.fillRect(cx, cy, 1, 1);
  }
  ctx.restore();
  return canvas;
}


// ═══════════════════════════════════════════════════════════
//  UNIFIED DRAW — dispatches to sprite or reticle path
// ═══════════════════════════════════════════════════════════
function drawCursor(canvas, index, opts) {
  const entry = ALL_CURSORS[index];
  if (entry.type === 'sprite') {
    return drawSpriteCursor(canvas, entry, opts);
  } else {
    return drawReticle(canvas, entry, opts.size || 32, opts);
  }
}

function getCursorHotspot(index, scaledSize) {
  const entry = ALL_CURSORS[index];
  if (entry.type === 'sprite') {
    const px = entry.pixels;
    const nativeW = Math.max(...px.map(r => r.length));
    const nativeH = px.length;
    const sx = scaledSize / nativeW;
    const sy = scaledSize / nativeH; // keep aspect; use max dim
    // scale factor is uniform based on the scale slider
    const scale = state.scale;
    return [
      Math.floor(entry.hotspot[0] * scale),
      Math.floor(entry.hotspot[1] * scale),
    ];
  }
  return [Math.floor(scaledSize / 2), Math.floor(scaledSize / 2)];
}


// ═══════════════════════════════════════════════════════════
//  GALLERY
// ═══════════════════════════════════════════════════════════
function renderGallery() {
  const container = document.getElementById('gallery');
  container.innerHTML = '';

  // Sprite section
  const spriteTitle = document.createElement('div');
  spriteTitle.className = 'gallery-section';
  spriteTitle.textContent = 'UI Cursors';
  container.appendChild(spriteTitle);

  const spriteGrid = document.createElement('div');
  spriteGrid.className = 'gallery-grid';
  SPRITE_CURSORS.forEach((s, i) => {
    spriteGrid.appendChild(makeGalleryItem(s, i));
  });
  container.appendChild(spriteGrid);

  // Reticle section
  const reticleTitle = document.createElement('div');
  reticleTitle.className = 'gallery-section';
  reticleTitle.textContent = 'Targeting Reticles';
  container.appendChild(reticleTitle);

  const reticleGrid = document.createElement('div');
  reticleGrid.className = 'gallery-grid';
  RETICLES.forEach((r, i) => {
    reticleGrid.appendChild(makeGalleryItem(r, SPRITE_CURSORS.length + i));
  });
  container.appendChild(reticleGrid);
}

function makeGalleryItem(entry, globalIndex) {
  const item = document.createElement('div');
  item.className = 'gallery-item' + (globalIndex === state.selected ? ' selected' : '');
  item.title = entry.desc;
  item.onclick = () => { state.selected = globalIndex; renderAll(); };

  const canvas = document.createElement('canvas');
  canvas.style.width = '48px';
  canvas.style.height = '48px';

  if (entry.type === 'sprite') {
    drawSpriteCursor(canvas, entry, { color1: state.color1, opacity: 100 });
  } else {
    drawReticle(canvas, entry, 24, {
      color1: state.color1, color2: state.color2,
      thickness: 2, gap: 2, outline: true, dot: false, opacity: 100,
    });
  }

  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = entry.name;

  item.appendChild(canvas);
  item.appendChild(label);
  return item;
}


// ═══════════════════════════════════════════════════════════
//  PREVIEW
// ═══════════════════════════════════════════════════════════
function renderPreview() {
  const canvas = document.getElementById('preview-lg');
  const entry = ALL_CURSORS[state.selected];

  if (entry.type === 'sprite') {
    drawSpriteCursor(canvas, entry, {
      color1: state.color1, opacity: state.opacity,
    });
    canvas.style.width = '128px';
    canvas.style.height = '128px';
    document.getElementById('hotspot-info').textContent =
      'hotspot: ' + entry.hotspot[0] + ',' + entry.hotspot[1];
  } else {
    drawReticle(canvas, entry, state.size, {
      color1: state.color1, color2: state.color2,
      thickness: state.thickness, gap: state.gap,
      outline: state.outline, dot: state.dot,
      opacity: state.opacity, anim: state.anim, frame: state.frame,
    });
    canvas.style.width = '128px';
    canvas.style.height = '128px';
    document.getElementById('hotspot-info').textContent = 'hotspot: center';
  }

  document.getElementById('reticle-name').textContent =
    entry.name + ' — ' + entry.desc;
}


// ═══════════════════════════════════════════════════════════
//  CURSOR UPDATE
// ═══════════════════════════════════════════════════════════
function updateCursor() {
  const entry = ALL_CURSORS[state.selected];
  const tmpCanvas = document.createElement('canvas');

  if (entry.type === 'sprite') {
    drawSpriteCursor(tmpCanvas, entry, {
      color1: state.color1, opacity: state.opacity,
    });
    // scale
    const nw = tmpCanvas.width * state.scale;
    const nh = tmpCanvas.height * state.scale;
    const scaled = document.createElement('canvas');
    scaled.width = nw; scaled.height = nh;
    const sc = scaled.getContext('2d');
    sc.imageSmoothingEnabled = false;
    sc.drawImage(tmpCanvas, 0, 0, nw, nh);
    const hot = getCursorHotspot(state.selected, nw);
    const url = scaled.toDataURL('image/png');
    document.getElementById('test-range').style.cursor =
      `url(${url}) ${hot[0]} ${hot[1]}, auto`;
  } else {
    drawReticle(tmpCanvas, entry, state.size, {
      color1: state.color1, color2: state.color2,
      thickness: state.thickness, gap: state.gap,
      outline: state.outline, dot: state.dot,
      opacity: state.opacity, anim: state.anim, frame: state.frame,
    });
    const cursorSize = state.size * state.scale;
    const scaled = document.createElement('canvas');
    scaled.width = cursorSize; scaled.height = cursorSize;
    const sc = scaled.getContext('2d');
    sc.imageSmoothingEnabled = false;
    sc.drawImage(tmpCanvas, 0, 0, cursorSize, cursorSize);
    const hot = Math.floor(cursorSize / 2);
    const url = scaled.toDataURL('image/png');
    document.getElementById('test-range').style.cursor =
      `url(${url}) ${hot} ${hot}, crosshair`;
  }
}


function renderAll() {
  renderGallery();
  renderPreview();
  updateCursor();

  // toggle controls visibility based on type
  const entry = ALL_CURSORS[state.selected];
  const isSprite = entry.type === 'sprite';
  document.getElementById('ctrl-thick').parentElement.parentElement.style.display = isSprite ? 'none' : '';
  document.getElementById('ctrl-gap').parentElement.parentElement.style.display = isSprite ? 'none' : '';
  document.getElementById('ctrl-dot').parentElement.parentElement.style.display = isSprite ? 'none' : '';
  document.getElementById('ctrl-anim').parentElement.style.display = isSprite ? 'none' : '';
  document.getElementById('ctrl-size').parentElement.parentElement.style.display = isSprite ? 'none' : '';
  // keep: color1, outline, opacity, scale for sprites
}


// ═══════════════════════════════════════════════════════════
//  STARFIELD
// ═══════════════════════════════════════════════════════════
let starsData = null;
function initStars() {
  const canvas = document.getElementById('stars-bg');
  const range = document.getElementById('test-range');
  canvas.width = range.clientWidth;
  canvas.height = range.clientHeight;

  const stars = [];
  for (let i = 0; i < 120; i++) {
    stars.push({
      x: Math.random()*canvas.width, y: Math.random()*canvas.height,
      size: Math.random()<0.8?1:2, brightness: 0.3+Math.random()*0.7,
      twinkle: Math.random()*Math.PI*2,
    });
  }
  const targets = [];
  for (let i = 0; i < 6; i++) {
    targets.push({
      x: 60+Math.random()*(canvas.width-120),
      y: 40+Math.random()*(canvas.height-80),
      vx: (Math.random()-0.5)*0.4, vy: (Math.random()-0.5)*0.3,
      size: 3+Math.floor(Math.random()*4),
      color: ['#cc3333','#55cc55','#c8a85a','#35c6bf','#cc55cc','#5555cc'][i],
    });
  }
  starsData = { canvas, stars, targets };
  if (!starsData.running) { starsData.running = true; drawStarsLoop(); }
}

function drawStarsLoop() {
  if (!starsData) return;
  const { canvas, stars, targets } = starsData;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const t = performance.now() * 0.001;
  for (const s of stars) {
    const b = s.brightness * (0.6 + 0.4 * Math.sin(t*1.5 + s.twinkle));
    const v = Math.round(b * 255);
    ctx.fillStyle = `rgb(${v},${v},${Math.min(255,v+30)})`;
    ctx.fillRect(Math.floor(s.x), Math.floor(s.y), s.size, s.size);
  }
  for (const tgt of targets) {
    tgt.x += tgt.vx; tgt.y += tgt.vy;
    if (tgt.x<20||tgt.x>canvas.width-20) tgt.vx*=-1;
    if (tgt.y<20||tgt.y>canvas.height-20) tgt.vy*=-1;
    ctx.fillStyle = tgt.color+'44';
    ctx.fillRect(Math.floor(tgt.x)-1, Math.floor(tgt.y)-1, tgt.size+2, tgt.size+2);
    ctx.fillStyle = tgt.color;
    ctx.fillRect(Math.floor(tgt.x), Math.floor(tgt.y), tgt.size, tgt.size);
    ctx.fillStyle = '#ffffff44';
    ctx.fillRect(Math.floor(tgt.x)+1, Math.floor(tgt.y)+1, Math.max(1,tgt.size-2), 1);
  }

  // interactive zones
  renderZones(canvas);
  requestAnimationFrame(drawStarsLoop);
}

// ── Interactive test zones (drawn on star canvas) ──
function renderZones(canvas) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;

  // "clickable" button zones
  const zones = [
    { x: 30, y: h*0.3, w: 100, h: 36, label: '[DOCK]' },
    { x: 30, y: h*0.3+50, w: 100, h: 36, label: '[TRADE]' },
    { x: 30, y: h*0.3+100, w: 100, h: 36, label: '[REPAIR]' },
    { x: w-160, y: h*0.5, w: 120, h: 80, label: 'DRAG\nZONE' },
  ];
  ctx.font = '14px VT323, monospace';
  ctx.textAlign = 'center';
  for (const z of zones) {
    ctx.strokeStyle = 'rgba(138,154,181,0.15)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4,4]);
    ctx.strokeRect(z.x, z.y, z.w, z.h);
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(138,154,181,0.25)';
    const lines = z.label.split('\n');
    lines.forEach((line, i) => {
      ctx.fillText(line, z.x+z.w/2, z.y+z.h/2 + (i - (lines.length-1)/2)*16 + 5);
    });
  }
}


// ═══════════════════════════════════════════════════════════
//  ANIMATION LOOP
// ═══════════════════════════════════════════════════════════
let animRunning = false;
function animLoop() {
  if (state.anim !== 'none' && ALL_CURSORS[state.selected].type === 'reticle') {
    state.frame += (state.anim === 'spin' ? 3 : 1);
    renderPreview();
    updateCursor();
    requestAnimationFrame(animLoop);
  } else { animRunning = false; }
}


// ═══════════════════════════════════════════════════════════
//  CLICK FLASH
// ═══════════════════════════════════════════════════════════
document.getElementById('test-range').addEventListener('click', (e) => {
  const range = document.getElementById('test-range');
  const rect = range.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const flash = document.createElement('div');
  flash.style.cssText = `
    position:absolute; left:${x}px; top:${y}px; width:6px; height:6px;
    background:${state.color1}; border-radius:50%; pointer-events:none;
    transform:translate(-50%,-50%) scale(1); opacity:1; z-index:20;
    transition: transform 0.25s ease-out, opacity 0.25s ease-out;
  `;
  range.appendChild(flash);
  requestAnimationFrame(() => {
    flash.style.transform = 'translate(-50%,-50%) scale(6)';
    flash.style.opacity = '0';
  });
  setTimeout(() => flash.remove(), 300);
});


// ═══════════════════════════════════════════════════════════
//  COORDINATES
// ═══════════════════════════════════════════════════════════
document.getElementById('test-range').addEventListener('mousemove', (e) => {
  const rect = e.currentTarget.getBoundingClientRect();
  document.getElementById('coords').textContent =
    String(Math.floor(e.clientX-rect.left)).padStart(3,'0') + ',' +
    String(Math.floor(e.clientY-rect.top)).padStart(3,'0');
});


// ═══════════════════════════════════════════════════════════
//  CONTROLS
// ═══════════════════════════════════════════════════════════
function bindControls() {
  const bind = (id, key, transform = v => v) => {
    const el = document.getElementById('ctrl-' + id);
    const valEl = document.getElementById('val-' + id);
    el.addEventListener('input', () => {
      const v = el.type==='checkbox' ? el.checked :
                el.type==='color' ? el.value : transform(el.value);
      state[key] = v;
      if (valEl) valEl.textContent = v;
      renderAll();
      if (key==='anim' && v!=='none' && !animRunning) {
        animRunning = true; state.frame = 0; animLoop();
      }
    });
  };
  bind('size','size',Number); bind('thick','thickness',Number);
  bind('gap','gap',Number); bind('color1','color1');
  bind('color2','color2'); bind('outline','outline');
  bind('dot','dot'); bind('anim','anim');
  bind('opacity','opacity',Number); bind('scale','scale',Number);
}


// ═══════════════════════════════════════════════════════════
//  EXPORT
// ═══════════════════════════════════════════════════════════
document.getElementById('btn-png').addEventListener('click', () => {
  const entry = ALL_CURSORS[state.selected];
  const tmp = document.createElement('canvas');
  if (entry.type === 'sprite') {
    drawSpriteCursor(tmp, entry, { color1: state.color1, opacity: state.opacity });
  } else {
    drawReticle(tmp, entry, state.size, {
      color1:state.color1, color2:state.color2,
      thickness:state.thickness, gap:state.gap,
      outline:state.outline, dot:state.dot, opacity:state.opacity,
    });
  }
  const link = document.createElement('a');
  link.download = `cursor-${entry.id}-${tmp.width}px.png`;
  link.href = tmp.toDataURL('image/png');
  link.click();
});

document.getElementById('btn-css').addEventListener('click', () => {
  const entry = ALL_CURSORS[state.selected];
  const tmp = document.createElement('canvas');
  if (entry.type === 'sprite') {
    drawSpriteCursor(tmp, entry, { color1: state.color1, opacity: state.opacity });
  } else {
    drawReticle(tmp, entry, state.size, {
      color1:state.color1, color2:state.color2,
      thickness:state.thickness, gap:state.gap,
      outline:state.outline, dot:state.dot, opacity:state.opacity,
    });
  }
  const sw = tmp.width * state.scale, sh = tmp.height * state.scale;
  const scaled = document.createElement('canvas');
  scaled.width = sw; scaled.height = sh;
  const sc = scaled.getContext('2d');
  sc.imageSmoothingEnabled = false;
  sc.drawImage(tmp, 0, 0, sw, sh);
  const hot = getCursorHotspot(state.selected, sw);
  const css = `cursor: url('${scaled.toDataURL('image/png')}') ${hot[0]} ${hot[1]}, auto;`;
  navigator.clipboard.writeText(css).then(() => {
    const btn = document.getElementById('btn-css');
    btn.textContent = '✓ COPIED';
    setTimeout(() => btn.textContent = '📋 CSS', 1500);
  });
});


// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
window.addEventListener('resize', initStars);
bindControls();
renderAll();
initStars();
</script>
</body>
</html>
