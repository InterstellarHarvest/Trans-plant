<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TRANS PLANT // Cruise Starfield</title>
<style>
  :root {
    --phos: #6cffaf;
    --phos-dim: #2d7d57;
    --warn: #ffb86c;
    --rev:  #6cdcff;
    --bg: #000;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--phos);
    font-family: 'Courier New', ui-monospace, monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    image-rendering: pixelated;
  }
  .ui {
    position: fixed;
    top: 12px; left: 12px;
    z-index: 10;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .btn {
    background: #000;
    color: var(--phos);
    border: 1px solid var(--phos-dim);
    padding: 8px 12px;
    font: 12px/1 'Courier New', monospace;
    letter-spacing: 0.15em;
    cursor: pointer;
    text-transform: uppercase;
    transition: background 0.1s, color 0.1s, border-color 0.1s;
  }
  .btn:hover { border-color: var(--phos); }
  .btn.active {
    background: var(--phos);
    color: #000;
    border-color: var(--phos);
    box-shadow: 0 0 12px rgba(108,255,175,0.5);
  }
  .btn.stop { color: var(--warn); border-color: #6b4d2a; margin-left: 12px; }
  .btn.stop:hover { border-color: var(--warn); }
  .btn.stop.active {
    background: var(--warn);
    color: #000;
    border-color: var(--warn);
    box-shadow: 0 0 12px rgba(255,184,108,0.5);
  }
  .btn.rev { color: var(--rev); border-color: #2a566b; }
  .btn.rev:hover { border-color: var(--rev); }
  .btn.rev.active {
    background: var(--rev);
    color: #000;
    border-color: var(--rev);
    box-shadow: 0 0 12px rgba(108,220,255,0.5);
  }
  .hud {
    position: fixed;
    bottom: 12px; left: 12px;
    z-index: 10;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--phos-dim);
    line-height: 1.7;
  }
  .hud b { color: var(--phos); font-weight: normal; }
  .hint {
    position: fixed;
    bottom: 12px; right: 12px;
    z-index: 10;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--phos-dim);
    text-align: right;
    line-height: 1.6;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.18) 3px
    );
    z-index: 5;
  }
</style>
</head>
<body>
  <div class="ui">
    <button class="btn" data-speed="0">Drift</button>
    <button class="btn" data-speed="1">Cruise</button>
    <button class="btn" data-speed="2">Boost</button>
    <button class="btn" data-speed="3">Warp</button>
    <button class="btn stop" id="stopBtn">Stop</button>
    <button class="btn rev"  id="revBtn">Reverse</button>
  </div>

  <canvas id="c"></canvas>

  <div class="hud" id="hud">— LOADING —</div>
  <div class="hint">[1][2][3][4] speed · [0]/[space] stop · [r] reverse</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const hud = document.getElementById('hud');

  let W = 0, H = 0;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    W = innerWidth; H = innerHeight;
    canvas.width  = (W * dpr) | 0;
    canvas.height = (H * dpr) | 0;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  addEventListener('resize', resize);

  // --- Parallax layers --------------------------------------------------
  // Positions stored in two Float32Arrays per layer.
  // Total: ~140 stars * 2 floats = ~1.1 KB.
  const LAYERS = [
    { count: 80, speed: 0.35, size: 1,   alpha: 0.55 }, // far
    { count: 42, speed: 0.95, size: 1.6, alpha: 0.85 }, // mid
    { count: 18, speed: 1.85, size: 2.4, alpha: 1.00 }  // near
  ];

  const layerData = LAYERS.map(L => {
    const xs = new Float32Array(L.count);
    const ys = new Float32Array(L.count);
    for (let i = 0; i < L.count; i++) {
      xs[i] = Math.random() * W;
      ys[i] = Math.random() * H;
    }
    return { xs, ys, cfg: L };
  });

  // --- Speed presets ----------------------------------------------------
  // mul       = global multiplier on each layer's base speed
  // streakAt  = if a layer's px-per-frame exceeds this, draw it as a streak
  const SPEEDS = [
    { name: 'DRIFT',  mul:  1, streakAt: Infinity },
    { name: 'CRUISE', mul:  4, streakAt: Infinity },
    { name: 'BOOST',  mul: 14, streakAt: 5 },
    { name: 'WARP',   mul: 42, streakAt: 2 }
  ];

  // Linear deceleration in mul-units per second when stopping.
  // 28/s → from WARP (42) to 0 in ~1.5s; from CRUISE (4) to 0 in ~0.14s.
  const STOP_DECEL = 28;
  // Easing rate when accelerating to a target (per 60fps frame).
  const ACCEL_EASE = 0.08;

  let speedIdx   = 1;
  let stopping   = false;
  let direction  = 1; // +1 = forward (stars stream left), -1 = reverse
  let targetMul  = SPEEDS[speedIdx].mul * direction;
  let currentMul = targetMul;

  // --- UI ---------------------------------------------------------------
  const speedButtons = [...document.querySelectorAll('.btn[data-speed]')];
  const stopBtn = document.getElementById('stopBtn');
  const revBtn  = document.getElementById('revBtn');

  function refreshButtons() {
    speedButtons.forEach((b, j) => {
      b.classList.toggle('active', !stopping && j === speedIdx);
    });
    stopBtn.classList.toggle('active', stopping);
    revBtn.classList.toggle('active', direction === -1);
  }

  function setSpeed(i) {
    speedIdx  = i;
    stopping  = false;
    targetMul = SPEEDS[i].mul * direction;
    refreshButtons();
  }

  function engageStop() {
    stopping = true;
    refreshButtons();
  }

  function toggleReverse() {
    direction = -direction;
    // If we were stopped, drop the stop so the new direction can spool up.
    stopping  = false;
    targetMul = SPEEDS[speedIdx].mul * direction;
    refreshButtons();
  }

  speedButtons.forEach(b => b.addEventListener('click', () => setSpeed(+b.dataset.speed)));
  stopBtn.addEventListener('click', engageStop);
  revBtn.addEventListener('click', toggleReverse);
  addEventListener('keydown', e => {
    if (e.key >= '1' && e.key <= '4') setSpeed(+e.key - 1);
    else if (e.key === '0' || e.key === ' ') { e.preventDefault(); engageStop(); }
    else if (e.key === 'r' || e.key === 'R') toggleReverse();
  });
  refreshButtons();

  // --- Loop -------------------------------------------------------------
  let lastT = performance.now();
  let fps = 60;

  function frame(now) {
    let dt = (now - lastT) / 16.6667; // 1.0 = one 60fps frame
    if (dt > 3) dt = 3;               // clamp post tab-switch
    const dtSec = (now - lastT) / 1000;
    lastT = now;

    fps = fps * 0.92 + (1000 / Math.max(1, dt * 16.6667)) * 0.08;

    // Throttle handling --------------------------------------------------
    if (stopping) {
      // Linear ramp-down toward 0, regardless of which direction we were going.
      const step = STOP_DECEL * dtSec;
      if (Math.abs(currentMul) <= step) currentMul = 0;
      else currentMul -= Math.sign(currentMul) * step;
    } else {
      // Smooth ease toward target (handles direction reversals by gliding through 0).
      currentMul += (targetMul - currentMul) * Math.min(1, ACCEL_EASE * dt);
      if (Math.abs(currentMul - targetMul) < 0.01) currentMul = targetMul;
    }

    // Clear --------------------------------------------------------------
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // Choose streak threshold from preset, but only meaningful while moving
    const preset = SPEEDS[speedIdx];
    const streakAt = stopping ? preset.streakAt : preset.streakAt;

    // Draw layers --------------------------------------------------------
    for (let l = 0; l < layerData.length; l++) {
      const { xs, ys, cfg } = layerData[l];
      const dx  = cfg.speed * currentMul * dt; // signed: + = leftward, - = rightward
      const adx = Math.abs(dx);
      const drawAsStreak = adx > streakAt;
      const n = xs.length;

      if (drawAsStreak) {
        // Streaks: one path, one stroke. Cheap.
        ctx.strokeStyle = 'rgba(255,255,255,' + cfg.alpha + ')';
        ctx.lineWidth = Math.max(1, cfg.size * 0.85);
        ctx.lineCap = 'butt';
        ctx.beginPath();
        for (let i = 0; i < n; i++) {
          let x = xs[i] - dx;
          if (dx >= 0) {
            // moving left – recycle off the left edge to the right
            if (x < -adx) { x = W + Math.random() * 40; ys[i] = Math.random() * H; }
          } else {
            // moving right – recycle off the right edge to the left
            if (x > W + adx) { x = -Math.random() * 40; ys[i] = Math.random() * H; }
          }
          xs[i] = x;
          ctx.moveTo(x, ys[i]);
          ctx.lineTo(x + dx, ys[i]);
        }
        ctx.stroke();
      } else {
        // Dots: fillRect is faster than arc().
        ctx.fillStyle = 'rgba(255,255,255,' + cfg.alpha + ')';
        const s = cfg.size;
        const half = s / 2;
        for (let i = 0; i < n; i++) {
          let x = xs[i] - dx;
          if (dx >= 0) {
            if (x < 0) { x = W; ys[i] = Math.random() * H; }
          } else {
            if (x > W) { x = 0; ys[i] = Math.random() * H; }
          }
          xs[i] = x;
          ctx.fillRect((x - half) | 0, (ys[i] - half) | 0, s, s);
        }
      }
    }

    // HUD ----------------------------------------------------------------
    const totalStars = layerData.reduce((a, b) => a + b.xs.length, 0);
    const absMul = Math.abs(currentMul);
    const absTarget = Math.abs(targetMul);
    const stateLabel = stopping
      ? (absMul < 0.05 ? 'STOPPED' : 'DECELERATING')
      : (absMul < absTarget - 0.5 ? 'THROTTLING UP' : preset.name);
    const dirLabel = currentMul === 0
      ? (direction === -1 ? 'REV' : 'FWD')
      : (currentMul < 0 ? 'REV' : 'FWD');
    hud.innerHTML =
      'state: <b>' + stateLabel + '</b> &nbsp;·&nbsp; ' +
      'dir: <b>' + dirLabel + '</b> &nbsp;·&nbsp; ' +
      'thrust: <b>' + absMul.toFixed(1) + 'x</b> &nbsp;·&nbsp; ' +
      'stars: <b>' + totalStars + '</b> &nbsp;·&nbsp; ' +
      'fps: <b>' + fps.toFixed(0) + '</b>';

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
