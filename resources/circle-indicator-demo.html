<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Circle Indicator Styles :: Chunky Pixel Demo</title>
<style>
:root {
  --bg: #0a0e14;
  --bg2: #11161e;
  --bg3: #161c26;
  --border: #1f2937;
  --accent: #ffcc44;
  --accent2: #00ffaa;
  --text: #e6e6e6;
  --text-dim: #6b7280;
  --good: #00ff88;
  --bad: #ff3366;
  --warn: #ffaa00;
  --mono: 'Courier New', 'Monaco', 'Consolas', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  background-image:
    radial-gradient(circle at 15% 0%, rgba(255,204,68,0.04), transparent 50%),
    radial-gradient(circle at 85% 100%, rgba(0,255,170,0.04), transparent 50%);
  color: var(--text);
  font-family: var(--mono);
  padding: 20px;
  min-height: 100vh;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 16px;
}
header h1 {
  font-size: 18px;
  color: var(--accent);
  letter-spacing: 2px;
  text-transform: uppercase;
}
header .sub {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 4px;
  letter-spacing: 1px;
}
header .global-stats { display: flex; gap: 8px; }
header .global-stats .stat {
  background: var(--bg2);
  border: 1px solid var(--border);
  padding: 8px 14px;
  border-radius: 3px;
  min-width: 110px;
}
header .global-stats label {
  display: block;
  font-size: 9px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
}
header .global-stats b {
  color: var(--accent);
  font-weight: normal;
  font-size: 18px;
  font-variant-numeric: tabular-nums;
}
main {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 14px;
  display: flex;
  flex-direction: column;
}
.card .head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
  gap: 8px;
}
.card h2 {
  font-size: 12px;
  color: var(--accent);
  letter-spacing: 1px;
}
.card .usecase {
  font-size: 9px;
  padding: 2px 6px;
  border-radius: 2px;
  letter-spacing: 1px;
  font-weight: bold;
  background: rgba(0,255,170,0.12);
  color: var(--accent2);
  border: 1px solid var(--accent2);
  white-space: nowrap;
}
.card .desc {
  font-size: 10.5px;
  color: var(--text-dim);
  margin-bottom: 12px;
  line-height: 1.45;
  min-height: 46px;
}
.card .stage {
  background: #000;
  background-image:
    linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size: 12px 12px;
  border: 1px solid var(--border);
  height: 260px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 10px;
  position: relative;
  overflow: hidden;
}
.card .stats {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 6px;
  font-size: 10px;
}
.card .stats .stat {
  background: var(--bg3);
  padding: 5px 7px;
  border-radius: 2px;
}
.card .stats .stat label {
  color: var(--text-dim);
  display: block;
  font-size: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 2px;
}
.card .stats .stat b {
  color: var(--accent);
  font-weight: normal;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}
.controls {
  display: flex;
  gap: 8px;
  margin-top: 16px;
  flex-wrap: wrap;
}
button {
  background: var(--bg2);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 8px 14px;
  border-radius: 3px;
  font-family: var(--mono);
  font-size: 11px;
  cursor: pointer;
  letter-spacing: 1px;
  text-transform: uppercase;
}
button:hover {
  border-color: var(--accent);
  color: var(--accent);
}
button.active {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
}
canvas {
  display: block;
  image-rendering: pixelated;
  image-rendering: -moz-crisp-edges;
  image-rendering: crisp-edges;
}
footer {
  margin-top: 24px;
  font-size: 10px;
  color: var(--text-dim);
  text-align: center;
  letter-spacing: 1px;
}
</style>
</head>
<body>

<header>
  <div>
    <h1>::: circle indicator styles :::</h1>
    <div class="sub">6 ways to draw attention to a sprite — all chunky pixel canvas</div>
  </div>
  <div class="global-stats">
    <div class="stat"><label>fps</label><b id="fps">--</b></div>
    <div class="stat"><label>frame ms</label><b id="frametime">--</b></div>
    <div class="stat"><label>js heap</label><b id="heap">--</b></div>
  </div>
</header>

<main id="cards"></main>

<div class="controls">
  <button id="pauseBtn">Pause</button>
  <button id="speedBtn">Slower</button>
</div>

<footer>
  Bresenham circles + parametric variants • integer-snapped pixels • alpha used for fade only, never edges
</footer>

<script>
// ========== SPRITE (16x16 coin/medallion) ==========
const SPRITE_STR = `
................
................
.....######.....
....##....##....
...##......##...
..##...##...##..
..##..####..##..
..##...##...##..
..##........##..
..##........##..
..##........##..
...##......##...
....##....##....
.....######.....
................
................
`.trim().split('\n');

const SW = 16, SH = 16;
const sprite = new Uint8Array(SW * SH);
for (let y = 0; y < SH; y++)
  for (let x = 0; x < SW; x++)
    sprite[y * SW + x] = SPRITE_STR[y][x] === '#' ? 1 : 0;

// ========== CANVAS CONFIG ==========
const CW = 40, CH = 40;       // logical canvas
const PIX = 6;                 // display scale
const CX = CW / 2, CY = CH / 2;
const SPRITE_OX = (CW - SW) / 2;
const SPRITE_OY = (CH - SH) / 2;

const SPRITE_COLOR = [255, 204, 68]; // gold
const SHADOW_COLOR = [120, 80, 20];

// ========== PIXEL HELPERS ==========
function setPx(data, x, y, r, g, b, a) {
  if (x < 0 || x >= CW || y < 0 || y >= CH) return;
  const i = ((y | 0) * CW + (x | 0)) * 4;
  if (a >= 255) {
    data[i] = r; data[i+1] = g; data[i+2] = b; data[i+3] = 255;
  } else {
    const af = a / 255;
    const inv = 1 - af;
    data[i]   = data[i]   * inv + r * af;
    data[i+1] = data[i+1] * inv + g * af;
    data[i+2] = data[i+2] * inv + b * af;
    data[i+3] = Math.max(data[i+3], a);
  }
}

function drawSprite(data) {
  for (let y = 0; y < SH; y++) {
    for (let x = 0; x < SW; x++) {
      if (sprite[y * SW + x]) {
        setPx(data, x + SPRITE_OX, y + SPRITE_OY, SPRITE_COLOR[0], SPRITE_COLOR[1], SPRITE_COLOR[2], 255);
      }
    }
  }
}

// Bresenham midpoint circle, 1px thick
function drawCircle(data, cx, cy, r, color, alpha) {
  if (r <= 0) return;
  let x = r | 0, y = 0;
  let err = 1 - x;
  const [cr, cg, cb] = color;
  while (x >= y) {
    setPx(data, cx + x, cy + y, cr, cg, cb, alpha);
    setPx(data, cx + y, cy + x, cr, cg, cb, alpha);
    setPx(data, cx - y, cy + x, cr, cg, cb, alpha);
    setPx(data, cx - x, cy + y, cr, cg, cb, alpha);
    setPx(data, cx - x, cy - y, cr, cg, cb, alpha);
    setPx(data, cx - y, cy - x, cr, cg, cb, alpha);
    setPx(data, cx + y, cy - x, cr, cg, cb, alpha);
    setPx(data, cx + x, cy - y, cr, cg, cb, alpha);
    y++;
    if (err < 0) err += 2 * y + 1;
    else { x--; err += 2 * (y - x) + 1; }
  }
}

// Parametric circle with arbitrary radius function and dash mask
function drawCircleParam(data, cx, cy, baseR, color, alpha, opts = {}) {
  const { rFn = null, dashFn = null, step = 0.015 } = opts;
  const [cr, cg, cb] = color;
  for (let theta = 0; theta < Math.PI * 2; theta += step) {
    if (dashFn && !dashFn(theta)) continue;
    const r = rFn ? rFn(theta) : baseR;
    const x = cx + r * Math.cos(theta);
    const y = cy + r * Math.sin(theta);
    setPx(data, Math.round(x), Math.round(y), cr, cg, cb, alpha);
  }
}

// ========== COLOR ==========
function pulseHue(t, offset = 0) {
  const h = (t * 0.06 + offset) % 360;
  return hsl2rgb(h, 100, 60);
}
function hsl2rgb(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [Math.round(f(0)*255), Math.round(f(8)*255), Math.round(f(4)*255)];
}

// ========== CARD HELPER ==========
function makeCard({ title, usecase, desc }) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="head">
      <h2>${title}</h2>
      <span class="usecase">${usecase}</span>
    </div>
    <div class="desc">${desc}</div>
    <div class="stage"></div>
    <div class="stats">
      <div class="stat"><label>render</label><b class="ms">--</b><span style="color:var(--text-dim);font-size:9px"> ms</span></div>
      <div class="stat"><label>cycle</label><b class="cy">--</b></div>
      <div class="stat"><label>peak ms</label><b class="peak">--</b></div>
    </div>
  `;
  document.getElementById('cards').appendChild(card);
  const canvas = document.createElement('canvas');
  canvas.width = CW; canvas.height = CH;
  canvas.style.width = (CW * PIX) + 'px';
  canvas.style.height = (CH * PIX) + 'px';
  const stage = card.querySelector('.stage');
  stage.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  return {
    el: card,
    msEl: card.querySelector('.ms'),
    cyEl: card.querySelector('.cy'),
    peakEl: card.querySelector('.peak'),
    peak: 0,
    canvas, ctx,
    img: ctx.createImageData(CW, CH),
  };
}

// ========== STYLE 1: POP PULSE ==========
function makePopPulse() {
  const card = makeCard({
    title: '1. Pop pulse',
    usecase: 'CLICK HERE',
    desc: 'Single circle expands from sprite outward, fades to nothing. Resets and repeats. Most common "tap target" idiom.',
  });
  return {
    card,
    update(t) {
      const start = performance.now();
      const data = card.img.data;
      data.fill(0);
      drawSprite(data);
      const period = 1200;
      const phase = (t % period) / period; // 0..1
      const r = 8 + phase * 12;
      const alpha = (1 - phase) * 255;
      const color = pulseHue(t);
      drawCircle(data, CX, CY, Math.round(r), color, alpha | 0);
      card.ctx.putImageData(card.img, 0, 0);
      card.cyEl.textContent = (phase * 100).toFixed(0) + '%';
      return performance.now() - start;
    }
  };
}

// ========== STYLE 2: SONAR RIPPLE ==========
function makeSonarRipple() {
  const card = makeCard({
    title: '2. Sonar ripple',
    usecase: 'CLICK HERE',
    desc: 'Three pop-pulses staggered by 1/3 cycle. Reads as outward sonar/radar wave. Stronger attention pull than a single pulse.',
  });
  return {
    card,
    update(t) {
      const start = performance.now();
      const data = card.img.data;
      data.fill(0);
      drawSprite(data);
      const period = 1800;
      for (let i = 0; i < 3; i++) {
        const phase = ((t + i * period / 3) % period) / period;
        const r = 8 + phase * 11;
        const alpha = (1 - phase) * 200;
        const color = pulseHue(t, i * 60);
        drawCircle(data, CX, CY, Math.round(r), color, alpha | 0);
      }
      card.ctx.putImageData(card.img, 0, 0);
      card.cyEl.textContent = '3 rings';
      return performance.now() - start;
    }
  };
}

// ========== STYLE 3: ROTATING DASHES ==========
function makeRotatingDashes() {
  const card = makeCard({
    title: '3. Rotating dashes',
    usecase: 'FOUND IT',
    desc: 'Dashed ring at fixed radius, rotating slowly. Reads as "selected" or "marked." Less aggressive than pulsing — good for a static "found" state.',
  });
  return {
    card,
    update(t) {
      const start = performance.now();
      const data = card.img.data;
      data.fill(0);
      drawSprite(data);
      const r = 13;
      const dashCount = 12;
      const dashWidth = Math.PI / dashCount; // half-on, half-off
      const period = Math.PI * 2 / dashCount;
      const offset = (t * 0.0015) % period;
      const color = pulseHue(t);
      drawCircleParam(data, CX, CY, r, color, 220, {
        step: 0.012,
        dashFn: theta => ((theta + offset) % period) < dashWidth,
      });
      card.ctx.putImageData(card.img, 0, 0);
      card.cyEl.textContent = ((offset / period) * 100).toFixed(0) + '%';
      return performance.now() - start;
    }
  };
}

// ========== STYLE 4: HAND-DRAWN WOBBLE ==========
function makeWobble() {
  const card = makeCard({
    title: '4. Hand-drawn wobble',
    usecase: 'FOUND IT',
    desc: 'Circle with low-frequency noise on the radius. Looks like someone circled it with a marker. Animates by shifting the noise phase.',
  });
  return {
    card,
    update(t) {
      const start = performance.now();
      const data = card.img.data;
      data.fill(0);
      drawSprite(data);
      const baseR = 13;
      const tt = t * 0.0015;
      const color = pulseHue(t);
      drawCircleParam(data, CX, CY, baseR, color, 230, {
        step: 0.01,
        rFn: theta => baseR
          + Math.sin(theta * 3 + tt) * 1.4
          + Math.cos(theta * 5 - tt * 0.7) * 1.0
          + Math.sin(theta * 7 + tt * 1.3) * 0.6,
      });
      card.ctx.putImageData(card.img, 0, 0);
      card.cyEl.textContent = 'wob';
      return performance.now() - start;
    }
  };
}

// ========== STYLE 5: TARGETING BRACKETS ==========
function makeBrackets() {
  const card = makeCard({
    title: '5. Targeting brackets',
    usecase: 'CLICK HERE',
    desc: '4 L-shaped corner brackets that breathe inward and outward. Reticle/scanner aesthetic. Reads as "lock-on."',
  });
  return {
    card,
    update(t) {
      const start = performance.now();
      const data = card.img.data;
      data.fill(0);
      drawSprite(data);
      const period = 1100;
      const phase = (t % period) / period;
      // breathe between offset 11 and 14
      const triPhase = phase < 0.5 ? phase * 2 : (1 - phase) * 2;
      const offset = Math.round(11 + triPhase * 3);
      const armLen = 4;
      const color = pulseHue(t);
      const [r, g, b] = color;
      // 4 corners: (+,+), (-,+), (-,-), (+,-)
      const corners = [[1,1],[-1,1],[-1,-1],[1,-1]];
      for (const [sx, sy] of corners) {
        const bx = CX + sx * offset;
        const by = CY + sy * offset;
        // horizontal arm (toward center)
        for (let i = 0; i < armLen; i++) {
          setPx(data, bx - sx * i, by, r, g, b, 240);
        }
        // vertical arm (toward center)
        for (let i = 0; i < armLen; i++) {
          setPx(data, bx, by - sy * i, r, g, b, 240);
        }
      }
      card.ctx.putImageData(card.img, 0, 0);
      card.cyEl.textContent = 'd=' + offset;
      return performance.now() - start;
    }
  };
}

// ========== STYLE 6: SPARKLE BURST ==========
function makeSparkles() {
  const card = makeCard({
    title: '6. Sparkle burst',
    usecase: 'FOUND IT',
    desc: 'Plus-shaped sparkles spawn at random points on a ring around the sprite, each growing & fading. Treasure-found / level-up feel.',
  });
  // pre-seed sparkle slots
  const SPARK_COUNT = 8;
  const sparks = [];
  for (let i = 0; i < SPARK_COUNT; i++) {
    sparks.push({
      angle: Math.random() * Math.PI * 2,
      bornAt: -Math.random() * 800,
      life: 600 + Math.random() * 400,
      r: 12 + Math.random() * 3,
    });
  }
  return {
    card,
    update(t) {
      const start = performance.now();
      const data = card.img.data;
      data.fill(0);
      drawSprite(data);
      let live = 0;
      for (const s of sparks) {
        const age = t - s.bornAt;
        if (age > s.life) {
          // respawn
          s.angle = Math.random() * Math.PI * 2;
          s.bornAt = t + Math.random() * 200;
          s.life = 600 + Math.random() * 400;
          s.r = 12 + Math.random() * 3;
          continue;
        }
        if (age < 0) continue;
        live++;
        const phase = age / s.life;
        // grow then shrink
        const size = phase < 0.4
          ? Math.round(phase * 2.5 * 3)
          : Math.round((1 - (phase - 0.4) / 0.6) * 3);
        const alpha = phase < 0.7 ? 255 : Math.round((1 - (phase - 0.7) / 0.3) * 255);
        if (size <= 0 || alpha <= 0) continue;
        const sx = Math.round(CX + s.r * Math.cos(s.angle));
        const sy = Math.round(CY + s.r * Math.sin(s.angle));
        const color = pulseHue(t, s.angle * 60);
        const [r, g, b] = color;
        // draw plus shape
        setPx(data, sx, sy, r, g, b, alpha);
        for (let d = 1; d <= size; d++) {
          setPx(data, sx + d, sy, r, g, b, alpha);
          setPx(data, sx - d, sy, r, g, b, alpha);
          setPx(data, sx, sy + d, r, g, b, alpha);
          setPx(data, sx, sy - d, r, g, b, alpha);
        }
      }
      card.ctx.putImageData(card.img, 0, 0);
      card.cyEl.textContent = live + '/' + SPARK_COUNT;
      return performance.now() - start;
    }
  };
}

// ========== INIT ==========
const techniques = [
  makePopPulse(),
  makeSonarRipple(),
  makeRotatingDashes(),
  makeWobble(),
  makeBrackets(),
  makeSparkles(),
];

// ========== CONTROLS ==========
let paused = false;
let speedMul = 1;
const pauseBtn = document.getElementById('pauseBtn');
const speedBtn = document.getElementById('speedBtn');

pauseBtn.onclick = () => {
  paused = !paused;
  pauseBtn.textContent = paused ? 'Play' : 'Pause';
  pauseBtn.classList.toggle('active', paused);
  if (!paused) { lastT = performance.now(); requestAnimationFrame(tick); }
};
const speeds = [1, 0.5, 0.25, 2];
let speedIdx = 0;
const speedLabels = ['Slower', 'Slowest', 'Faster', 'Normal'];
speedBtn.onclick = () => {
  speedIdx = (speedIdx + 1) % speeds.length;
  speedMul = speeds[speedIdx];
  speedBtn.textContent = speedLabels[speedIdx];
};

// ========== ANIMATION LOOP ==========
const fpsEl = document.getElementById('fps');
const frametimeEl = document.getElementById('frametime');
const heapEl = document.getElementById('heap');

let lastT = performance.now();
let virtualT = 0;
let frames = 0;
let fpsAcc = 0;
let lastFpsUpdate = lastT;

function tick(now) {
  if (paused) return;
  const dt = now - lastT;
  lastT = now;
  virtualT += dt * speedMul;
  frames++;
  fpsAcc += dt;

  for (const t of techniques) {
    const ms = t.update(virtualT);
    t.card.msEl.textContent = ms.toFixed(2);
    if (ms > t.card.peak) {
      t.card.peak = ms;
      t.card.peakEl.textContent = ms.toFixed(2);
    }
  }

  if (now - lastFpsUpdate > 400) {
    const fps = (frames * 1000 / fpsAcc);
    fpsEl.textContent = fps.toFixed(1);
    frametimeEl.textContent = (fpsAcc / frames).toFixed(2);
    if (performance.memory) {
      const mb = performance.memory.usedJSHeapSize / 1024 / 1024;
      heapEl.textContent = mb.toFixed(1) + ' MB';
    } else {
      heapEl.textContent = 'n/a';
    }
    frames = 0;
    fpsAcc = 0;
    lastFpsUpdate = now;
  }

  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

setInterval(() => {
  for (const t of techniques) t.card.peak = 0;
}, 5000);
</script>
</body>
</html>
