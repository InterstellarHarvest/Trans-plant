<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel Weld Border :: Live Demo</title>
<style>
:root {
  --bg: #0a0e14;
  --bg2: #11161e;
  --bg3: #161c26;
  --border: #1f2937;
  --accent: #ffaa44;
  --text: #e6e6e6;
  --text-dim: #6b7280;
  --mono: 'Courier New', 'Monaco', 'Consolas', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  padding: 20px;
  min-height: 100vh;
}
header {
  border-bottom: 1px solid var(--border);
  padding-bottom: 14px;
  margin-bottom: 20px;
}
header h1 {
  font-size: 18px;
  color: var(--accent);
  letter-spacing: 2px;
  text-transform: uppercase;
}
header .sub {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 4px;
  letter-spacing: 1px;
}
main {
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 20px;
}
@media (max-width: 800px) { main { grid-template-columns: 1fr; } }

.preview {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 20px;
}
.preview h2 {
  font-size: 12px;
  color: var(--accent);
  margin-bottom: 14px;
  letter-spacing: 1px;
}
.preview .stage {
  background: #000;
  background-image:
    linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size: 24px 24px;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px;
  min-height: 360px;
}
canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }

.controls {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.controls h2 { font-size: 12px; color: var(--accent); letter-spacing: 1px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label {
  font-size: 10px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  display: flex;
  justify-content: space-between;
}
.field label b { color: var(--accent); font-weight: normal; }
.field input[type=range] { width: 100%; }
.field select, .field input[type=text] {
  background: var(--bg3);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 6px 8px;
  border-radius: 2px;
  font-family: var(--mono);
  font-size: 11px;
}
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
button {
  background: var(--bg3);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 8px 12px;
  border-radius: 2px;
  font-family: var(--mono);
  font-size: 10px;
  cursor: pointer;
  letter-spacing: 1px;
  text-transform: uppercase;
}
button:hover { border-color: var(--accent); color: var(--accent); }
button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }

.variants {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-top: 16px;
}
.variant {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 10px;
  cursor: pointer;
  text-align: center;
}
.variant:hover { border-color: var(--accent); }
.variant.active { border-color: var(--accent); background: rgba(255,170,68,0.08); }
.variant canvas { margin: 0 auto 8px; }
.variant .name {
  font-size: 9px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
}
.variant.active .name { color: var(--accent); }

.code {
  margin-top: 20px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 16px;
}
.code h2 { font-size: 12px; color: var(--accent); margin-bottom: 10px; letter-spacing: 1px; }
.code pre {
  background: #000;
  border: 1px solid var(--border);
  padding: 12px;
  font-size: 10.5px;
  overflow-x: auto;
  color: #aab;
  line-height: 1.5;
}
</style>
</head>
<body>

<header>
  <h1>::: pixel weld border :::</h1>
  <div class="sub">distance-field bead generator with bumpiness + lighting • drop-in function below</div>
</header>

<main>
  <div class="preview">
    <h2>preview</h2>
    <div class="stage">
      <canvas id="main"></canvas>
    </div>
    <div class="variants" id="variants"></div>
  </div>

  <div class="controls">
    <h2>parameters</h2>

    <div class="field">
      <label>thickness <b id="lblThickness">3</b></label>
      <input type="range" id="thickness" min="1" max="6" step="1" value="3">
    </div>

    <div class="field">
      <label>bumpiness <b id="lblBumpiness">0.55</b></label>
      <input type="range" id="bumpiness" min="0" max="1" step="0.05" value="0.55">
    </div>

    <div class="field">
      <label>noise scale <b id="lblNoiseScale">2</b></label>
      <input type="range" id="noiseScale" min="1" max="5" step="1" value="2">
    </div>

    <div class="field">
      <label>hot spots <b id="lblHotChance">0.00</b></label>
      <input type="range" id="hotChance" min="0" max="0.15" step="0.01" value="0">
    </div>

    <div class="field">
      <label>seed <b id="lblSeed">12345</b></label>
      <input type="number" id="seed" value="12345">
    </div>

    <div class="field">
      <label>light angle</label>
      <select id="lightAngle">
        <option value="-1,-1">upper-left</option>
        <option value="0,-1">top</option>
        <option value="1,-1">upper-right</option>
        <option value="-1,0">left</option>
        <option value="1,0">right</option>
      </select>
    </div>

    <div class="row">
      <button id="reseedBtn">Reseed</button>
      <button id="downloadBtn" class="primary">Download PNG</button>
    </div>
  </div>
</main>

<div class="code">
  <h2>core function (paste this)</h2>
  <pre id="codeBlock"></pre>
</div>

// =============================================================
// CORE FUNCTION — drop into your project, no deps required.
// =============================================================
/**
 * Add a chunky-pixel weld bead around the opaque region of an image.
 * @param {ImageData} src  - source pixels; alpha > 127 = "panel"
 * @param {Object} opts
 * @param {number} opts.thickness   max bead thickness in pixels (1-6 typical)
 * @param {number} opts.bumpiness   0=smooth bead, 1=very lumpy (reduces effective thickness in noisy spots)
 * @param {number} opts.noiseScale  noise grid size in pixels (2-3 = chunky, 1 = noisy)
 * @param {number} opts.seed        hash seed
 * @param {Object} opts.palette     {shadow, mid, highlight, hot} as [r,g,b,a]
 * @param {number} opts.hotChance   0..1 chance per pixel of a "hot spot" override (e.g. fresh weld spark)
 * @param {Array}  opts.lightDir    [dx, dy] light source vector (e.g. [-1,-1] = upper-left)
 * @returns {ImageData} new ImageData with weld bead written into transparent pixels
 */
function applyWeldBorder(src, opts = {}) {
  const {
    thickness = 3, bumpiness = 0.55, noiseScale = 2, seed = 12345,
    palette = {
      shadow:    [20, 25, 35, 255],
      mid:       [70, 85, 105, 255],
      highlight: [150, 165, 185, 255],
      hot:       [240, 150, 60, 255],
    },
    hotChance = 0,
    lightDir = [-1, -1],
  } = opts;

  const w = src.width, h = src.height, sd = src.data;
  const out = new ImageData(new Uint8ClampedArray(sd), w, h);
  const od = out.data;

  // 1. mask
  const mask = new Uint8Array(w * h);
  for (let i = 0, p = 0; i < mask.length; i++, p += 4) mask[i] = sd[p + 3] > 127 ? 1 : 0;

  // 2. distance transform (8-conn chamfer) + nearest-source tracking
  const INF = 9999;
  const dist = new Int16Array(w * h);
  const nx = new Int16Array(w * h), ny = new Int16Array(w * h);
  for (let i = 0; i < dist.length; i++) {
    if (mask[i]) { dist[i] = 0; nx[i] = i % w; ny[i] = (i / w) | 0; }
    else         { dist[i] = INF; nx[i] = -1; ny[i] = -1; }
  }
  const relax = (i, j) => {
    if (j < 0 || j >= dist.length) return;
    const c = dist[j] + 1;
    if (c < dist[i]) { dist[i] = c; nx[i] = nx[j]; ny[i] = ny[j]; }
  };
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x;
    if (x > 0)             relax(i, i - 1);
    if (y > 0)             relax(i, i - w);
    if (x > 0 && y > 0)     relax(i, i - w - 1);
    if (x < w-1 && y > 0)   relax(i, i - w + 1);
  }
  for (let y = h-1; y >= 0; y--) for (let x = w-1; x >= 0; x--) {
    const i = y * w + x;
    if (x < w-1)            relax(i, i + 1);
    if (y < h-1)            relax(i, i + w);
    if (x < w-1 && y < h-1) relax(i, i + w + 1);
    if (x > 0 && y < h-1)   relax(i, i + w - 1);
  }

  // 3. hash → value noise [0,1)
  const hash = (a, b, c) => {
    let v = (a * 374761393) ^ (b * 668265263) ^ (c * 2147483647);
    v = (v ^ (v >>> 13)) * 1274126177;
    return ((v ^ (v >>> 16)) >>> 0) / 4294967295;
  };

  // 4. light vec
  const ll = Math.hypot(lightDir[0], lightDir[1]) || 1;
  const lx = lightDir[0] / ll, ly = lightDir[1] / ll;

  // 5. paint weld pixels
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x;
    if (mask[i]) continue;
    const d = dist[i];
    if (d <= 0 || d > thickness) continue;

    // bumpiness: low-freq noise eats into thickness
    const gx = (x / noiseScale) | 0, gy = (y / noiseScale) | 0;
    const n = hash(gx, gy, seed);
    const eff = thickness - bumpiness * (1 - n) * thickness * 0.7;
    if (d > eff) continue;

    // outward normal → lambert
    const ox = x - nx[i], oy = y - ny[i];
    const ol = Math.hypot(ox, oy) || 1;
    const lam = (ox / ol) * lx + (oy / ol) * ly;

    let c;
    if (d >= thickness)              c = palette.shadow;
    else if (lam > 0.3 && d <= 2)    c = palette.highlight;
    else if (lam < -0.2)             c = palette.shadow;
    else                             c = palette.mid;

    if (hotChance > 0 && hash(x, y, seed + 999) < hotChance) c = palette.hot;

    const p = i * 4;
    od[p] = c[0]; od[p+1] = c[1]; od[p+2] = c[2]; od[p+3] = c[3];
  }
  return out;
}
// =============================================================
// END CORE FUNCTION

const PIX = 8;
let baseImage = null;

const mainCanvas = document.getElementById('main');
const mainCtx = mainCanvas.getContext('2d');

const ui = {
  thickness: document.getElementById('thickness'),
  bumpiness: document.getElementById('bumpiness'),
  noiseScale: document.getElementById('noiseScale'),
  hotChance: document.getElementById('hotChance'),
  seed: document.getElementById('seed'),
  lightAngle: document.getElementById('lightAngle'),
};
const lbl = {
  thickness: document.getElementById('lblThickness'),
  bumpiness: document.getElementById('lblBumpiness'),
  noiseScale: document.getElementById('lblNoiseScale'),
  hotChance: document.getElementById('lblHotChance'),
  seed: document.getElementById('lblSeed'),
};

let activePalette = 'matched';

function getOpts() {
  const ld = ui.lightAngle.value.split(',').map(Number);
  return {
    thickness: +ui.thickness.value,
    bumpiness: +ui.bumpiness.value,
    noiseScale: +ui.noiseScale.value,
    hotChance: +ui.hotChance.value,
    seed: +ui.seed.value,
    lightDir: ld,
    palette: PALETTES[activePalette].palette,
  };
}

function render() {
  if (!baseImage) return;
  // sync labels
  lbl.thickness.textContent = ui.thickness.value;
  lbl.bumpiness.textContent = (+ui.bumpiness.value).toFixed(2);
  lbl.noiseScale.textContent = ui.noiseScale.value;
  lbl.hotChance.textContent = (+ui.hotChance.value).toFixed(2);
  lbl.seed.textContent = ui.seed.value;

  // we need padding around the image for the bead
  const pad = 8;
  const w = baseImage.width + pad * 2;
  const h = baseImage.height + pad * 2;

  // build padded source ImageData
  const tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  const tctx = tmp.getContext('2d');
  tctx.drawImage(baseImage, pad, pad);
  const src = tctx.getImageData(0, 0, w, h);

  const out = applyWeldBorder(src, getOpts());

  mainCanvas.width = w;
  mainCanvas.height = h;
  mainCanvas.style.width = (w * PIX) + 'px';
  mainCanvas.style.height = (h * PIX) + 'px';
  mainCtx.putImageData(out, 0, 0);
}

function renderVariants() {
  if (!baseImage) return;
  const container = document.getElementById('variants');
  container.innerHTML = '';
  const pad = 8;
  const w = baseImage.width + pad * 2;
  const h = baseImage.height + pad * 2;
  const tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  const tctx = tmp.getContext('2d');
  tctx.drawImage(baseImage, pad, pad);
  const src = tctx.getImageData(0, 0, w, h);

  for (const [key, p] of Object.entries(PALETTES)) {
    const div = document.createElement('div');
    div.className = 'variant' + (key === activePalette ? ' active' : '');
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.style.width = (w * 3) + 'px';
    c.style.height = (h * 3) + 'px';
    const cctx = c.getContext('2d');
    const out = applyWeldBorder(src, {
      ...getOpts(),
      palette: p.palette,
      hotChance: p.hotChance,
    });
    cctx.putImageData(out, 0, 0);
    div.appendChild(c);
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = p.name;
    div.appendChild(name);
    div.onclick = () => { activePalette = key; render(); renderVariants(); };
    container.appendChild(div);
  }
}

// wire controls
for (const id of ['thickness','bumpiness','noiseScale','hotChance','seed','lightAngle']) {
  ui[id].addEventListener('input', () => { render(); renderVariants(); });
}
document.getElementById('reseedBtn').onclick = () => {
  ui.seed.value = (Math.random() * 1e9) | 0;
  render(); renderVariants();
};
document.getElementById('downloadBtn').onclick = () => {
  const url = mainCanvas.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = url;
  a.download = `welded_${activePalette}_t${ui.thickness.value}_s${ui.seed.value}.png`;
  a.click();
};

// load image
const img = new Image();
img.onload = () => { baseImage = img; render(); renderVariants(); };
img.src = 'data:image/png;base64,' + SRC_B64;

// dump function source into the code block
document.getElementById('codeBlock').textContent =
  applyWeldBorder.toString();
</script>
